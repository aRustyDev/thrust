# cargo-mutants configuration. Adapted from .agents/skills/rust-test-mutation/references/examples/mutants.toml.
# Verified with cargo-mutants 27.1.0 and cargo-nextest 0.9.140.

# Run each mutant's tests with nextest, under the `mutants` nextest profile (.config/nextest.toml):
# fail fast, no retries, oracle tests excluded by the inherited default filter.
test_tool = "nextest"
additional_cargo_test_args = ["--profile", "mutants"]

# Cargo build profile (no debuginfo: faster incremental builds per mutant), defined in the root Cargo.toml.
# Keep the two together: with this line set and no [profile.mutants] there, cargo-mutants stops at the baseline
# with "profile `mutants` is not defined" and exit 4, which looks like the project's own tree is broken [re-run].
profile = "mutants"

# Not product code. The contract-suite crate is the test harness itself (its mutants would only test the tests).
# fuzz_harness.rs needed excluding; test_support.rs and tests/common/ are belt-and-braces (code under
# #[cfg(test)] is not mutated).
exclude_globs = [
  "crates/thrust-contract-tests/**",
  "**/fuzz_harness.rs",
  "**/test_support.rs",
  "**/tests/common/**",
]

# Uncomment if the workspace denies warnings: mutants that delete code trip unused-* lints.
# cap_lints = true
