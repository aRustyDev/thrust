# cargo-mutants configuration. Adapted from .agents/skills/rust-test-mutation/references/examples/mutants.toml.
# Verified with cargo-mutants 27.1.0 and cargo-nextest 0.9.140.

# Run each mutant's tests with nextest, under the `mutants` nextest profile (.config/nextest.toml):
# fail fast, no retries, oracle tests excluded by the inherited default filter.
test_tool = "nextest"
additional_cargo_test_args = ["--profile", "mutants"]

# Cargo build profile (no debuginfo: faster incremental builds per mutant), defined in the root Cargo.toml.
# Keep the two together: with this line set and no [profile.mutants] there, cargo-mutants stops at the baseline
# with "profile `mutants` is not defined" and exit 4, which looks like the project's own tree is broken [re-run].
profile = "mutants"

# Not product code. The contract-suite crate is the test harness itself (its mutants would only test the tests).
# The other three are the test-support files the rust-test-* skills tell a crate to add. None exists yet; they are
# excluded in advance so the first crate to add one is not mutated. fuzz_harness.rs needed excluding in the
# reference workspace; test_support.rs and tests/common/ are belt-and-braces (code under #[cfg(test)] is not mutated).
exclude_globs = [
  "crates/testing/suites/api/**",
  "**/fuzz_harness.rs",
  "**/test_support.rs",
  "**/tests/common/**",
  # wasm32 only (`#[cfg(target_arch = "wasm32")]`): a native run builds its mutants without compiling them, so every one would
  # read as MISSED. It has no native test to catch them; that gap is G-41 in docs/src/testing/status.md.
  "crates/edge/src/runtime.rs",
]

# An equivalent mutant, shown and not assumed: `thrust_html::strip_tags` loops while the text has a `<` and a `>`, and `||` for `&&` changes
# nothing. `strip_once` removes a `<` only by finding the `>` that ends it (a tag, a comment, a declaration), so a text with no `>` has
# none to remove and one with no `<` has none either: the first pass leaves the count of `<` as it was, and the loop breaks at once,
# which is what not entering it comes to. (The same function's `==` for `!=` is not equivalent, it loops for ever, and is caught as a
# timeout.) The regex matches the mutant's whole name as `--list` prints it.
exclude_re = [
  "replace && with \\|\\| in strip_tags",
]

# Uncomment if the workspace denies warnings: mutants that delete code trip unused-* lints.
# cap_lints = true
