# git-cliff configuration: the changelog and the next version (issue: the rc/* release flow).
#
# `.github/scripts/release-pr.sh` runs git-cliff on every push to main. What this file lets into the changelog is also what
# makes a release: a commit that renders no line (docs, tests, CI, chores) does not start a release candidate, so a docs-only
# merge does not deploy staging. Commit subjects are Conventional Commits (docs/src/contributing/standards.md).
#
#   git cliff --bumped-version          the next version, from the last v* tag and the commits after it
#   git cliff --unreleased --context    the commits that would go into it (none: nothing to release)
#   git cliff --tag vX.Y.Z -o CHANGELOG.md

[changelog]
header = """
# Changelog

Every release of Thrust, newest first. Written by git-cliff from the commit subjects on `main` (`cliff.toml`).
Only features, fixes, performance work, refactors, reverts and breaking changes are listed.
"""
# One section per release. Only the subject is rendered, never the body, so `Refs:` trailers and squashed commit lists stay out.
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
# Only v-prefixed semver tags are releases; `spike/0002-worker-do` and the like are not.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "newest"
# The numbers in the HTML comments order the groups; striptags removes them when rendered.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  # A breaking change of any other type is still listed: protect_breaking_commits keeps it past the skip below.
  { message = ".*", group = "<!-- 5 -->Other breaking changes", skip = true },
]

[bump]
# 0.x: a feature bumps the minor, a fix the patch, and a breaking change the minor too (not 1.0.0). Going to 1.0.0 is a decision,
# made by tagging it, not something a commit subject does by accident.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
