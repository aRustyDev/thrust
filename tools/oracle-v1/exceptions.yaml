# Exception register for the Plane v1 oracle (Q-0122.2). Format documented in oracle/NORMALISATION.md.
#
# One file, three jobs:
#   gate              -- how the conformance gate is configured (so the gate is reproducible)
#   scope_exclusions  -- operations the gate does NOT exercise, and what covers them instead
#   entries           -- known, justified failures the gate ACCEPTS (each one is a recorded difference)
#
# Nothing is accepted silently: an entry needs a reason and a rust_expectation, an unmatched failure
# fails the gate, and a non-optional entry that matches nothing is STALE and also fails the gate.
format_version: 1

gate:
  schemathesis: "4.31.1"          # pinned; bump deliberately, results are tool-version dependent
  checks: [not_a_server_error, status_code_conformance, content_type_conformance, response_schema_conformance]
  phases: [fuzzing]               # the `examples` phase uses schema literals (slug "my-workspace") and bypasses the seeded-id hook
  seed: 1
  deterministic: true
  max_examples: 10
  workers: 1                      # one worker: parallel PATCH/POST interleavings would make the failure set order-dependent
  # Vacuity guard. A run that never reached the handlers proves nothing, so these floors are part
  # of the gate. Measured on the pin, then rounded down; raise them if the schema grows.
  min_operations_tested: 100
  min_operations_with_2xx: 40

scope_exclusions:
  - id: SX-001
    method: DELETE
    reason: >
      Deleting the seeded project/work items/labels mid-run would turn every later request into a 404
      and make the rest of the run vacuous. Destructive operations are exercised on SCRATCH entities
      created by the corpus recorder instead.
    covered_by:
      - "harness/record_corpus.py: create-then-delete of SCRATCH projects, states, labels, work items, comments, links, members and a user asset (the P0 resources)"
      - "NOT covered by anything yet [unverified]: DELETE on cycles, modules, intake, stickies, invitations, relations, attachments of a seeded item. Wave-2 work."
  - id: SX-002
    path_regex: "/(archive|unarchive|transfer-work-items|transfer-issues)/$"
    reason: >
      State transitions on the seeded project/cycle/module (archive, unarchive, transfer) change what
      every other operation can see, and are not idempotent under fuzzing.
    covered_by:
      - "harness/record_corpus.py: archive/unarchive of a SCRATCH project only"
      - "NOT covered by anything yet [unverified]: cycle and module archive/unarchive, cycle/work-item transfer. Cycles and modules are outside the P0 resource list of spike 0008."

# A part of the schema that a run covers, for a target that serves only a part of it (thrust issue #58):
# `run_conformance.py --scope NAME`. See that script's doc for how a scoped run is stricter than the whole one.
scopes:
  m1:
    description: the operations the M1 walking skeleton serves, in the four tags of the pinned schema (32 operations)
    tags: [Projects, States, Labels, Work Items]
    # NOT `--continue-on-failure`, on purpose. Without it Hypothesis stops generating for an operation once a case of it fails, so what
    # is sent depends on what the target answered; but a target that behaves as the pin does is sent the same cases, and one that
    # does not fails the gate anyway (an unaccepted failure, or an entry that no longer fires). With it, a scoped run on the PIN sends
    # 250 cases instead of 162 and finds 23 more failure classes that the register has never recorded (500s and 400s of
    # `projects-lite/` and `projects/` among them): the register under-approximates the pin at deeper exploration, which is a
    # separate piece of work (thrust issue #58, recorded in the PR), not something this scope's baseline should absorb silently.
    #
    # The fuzzer sends JSON bodies only: the pin also reads form and multipart bodies and Thrust answers 415 to them, on purpose
    # (DEVIATIONS D-030 (5), owner confirmed 2026-11-07), so a gate that sent them could not compare the two.
    json_bodies_only: true
    # Measured on the pin: a scoped run on a freshly seeded Plane (ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic), twice,
    # with the same result both times: 25 operations run (32 less the six DELETEs and the archive POST that SX-001 and SX-002 keep out),
    # 24 of them reaching a 2xx (`POST .../projects/` answers 400 and 409 to what the fuzzer sends). The run is deterministic, so
    # these are the numbers, not rounded down as the whole schema's are.
    min_operations_tested: 25
    min_operations_with_2xx: 24
    # The corpus comparison (`compare_corpus.py`): which recorded resources it compares, and the floor of exchanges that fall on this
    # scope's operations.
    corpus:
      resources: [projects, states, labels, work_items, pagination, errors]
      # the exchanges of those resources that fall on the 32 operations: 108 in the committed corpus. Issue #58 counted 105; the
      # three more are the ones recorded on Plane for `DELETE .../issues/{pk}/` (create, delete, detail after), the one operation of
      # the scope that the corpus had no exchange for.
      min_exchanges_compared: 108
    # Where each entry fires in a run of THIS scope on the pin, which REPLACES the entry's own `match.operations` for this scope.
    # The fuzzer's cases depend on which operations a run holds, so the lists above (measured on the whole schema) are not those
    # of a part of it: here the 500s of EX-001/EX-002 fall on the legacy `issues/` list and not on `work-items/` (one view serves
    # both paths, so it is the cases that differ, not the code). An entry that fires nowhere in the scope is not listed, and an
    # entry listed here must fire on every operation given, or the run fails as stale.
    entry_operations:
      EX-001: &ex500
        - POST /api/v1/workspaces/{slug}/projects/{project_id}/issues/
      EX-002: *ex500
      EX-003:
        - GET /api/v1/workspaces/{slug}/projects/{project_id}/states/
      EX-004:
        - POST /api/v1/workspaces/{slug}/projects/
      EX-006:
        - GET /api/v1/workspaces/{slug}/projects-lite/
        - GET /api/v1/workspaces/{slug}/projects/
        - GET /api/v1/workspaces/{slug}/projects/{pk}/
        - PATCH /api/v1/workspaces/{slug}/projects/{pk}/
      EX-007:
        - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/{pk}/
        - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/{pk}/
      EX-011:
        - GET /api/v1/workspaces/{slug}/issues/search/
        - GET /api/v1/workspaces/{slug}/work-items/search/
      EX-013:
        operations:
          - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/
        # the case that finds it asks for `expand=created_by,updated_by`; Thrust does not expand those two (D-033 (5)), so its
        # answer is the ids the schema describes: fires on the pin only
        absent_on_thrust: "D-033 (5): expand is built for state, assignees and labels only"

entries:
- id: EX-001
  kind: upstream-bug
  applies_to: conformance
  status: active
  optional: false
  match:
    check: not_a_server_error
    failure_type: ServerError
    operations:
    - GET /api/v1/workspaces/{slug}/members-lite/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/project-members-lite/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/{issue_id}/comments/
    - POST /api/v1/workspaces/{slug}/assets/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/intake-issues/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/issues/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/work-items/
  reason: 'Unhandled exceptions return HTTP 500. Root causes seen: per_page=0 -> ZeroDivisionError and per_page<0
    -> ''Negative indexing'' in utils/paginator.py; invalid fields/expand/payload shapes; and POST /workspaces/{slug}/assets/
    raises TypeError because api/views/asset.py calls S3Storage(request=..., is_server=True) while S3Storage.__init__(self,
    request=None) has no such parameter (present on upstream preview 879ce8b5c6, so not a fork or merge artefact).
    Incomplete (research/0005, round 27): other 500 sources exist, a `deleted_at` body on work-item create (PQ-404),
    a non-object `issue` on intake create (PQ-405), array bodies (PQ-406) and two more `is_server` sites (PQ-401).
    Owner decision, round 27 (Q-0033.2, Q-0122.3, ADR-0031): reproduce all of them, as a HANDLED error with the same
    status and body, never a crash of the process.'
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-002
  kind: upstream-bug
  applies_to: conformance
  status: active
  optional: false
  match:
    check: status_code_conformance
    operations:
    - GET /api/v1/workspaces/{slug}/members-lite/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/project-members-lite/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/{issue_id}/comments/
    - POST /api/v1/workspaces/{slug}/assets/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/intake-issues/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/issues/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/work-items/
    message_regex: 'Received: 500'
  reason: 'Same operations and causes as EX-001, seen through the status-code check: 500 is not a documented response.
    Reproduced as a handled 500 (round 27, Q-0033.2), like EX-001.'
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-003
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: status_code_conformance
    methods:
    - GET
    operations:
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/archived-cycles/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/archived-modules/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/cycles-lite/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/cycles/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/cycles/{cycle_id}/cycle-issues/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/intake-issues/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/{issue_id}/comments/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/modules-lite/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/modules/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/modules/{module_id}/module-issues/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/states/
    message_regex: 'Received: 400'
  reason: Invalid query parameters (cursor, per_page, order_by, ...) are rejected with 400, which the schema does
    not list for these list operations (it documents 200/401/403/404 only). The status code IS the behaviour.
    Partly measures the fixture (research/0005, PQ-056, PQ-314) because the seeded projects have cycle_view, module_view
    and intake_view switched off, so the cycle, module and intake operations always answer 400 `non_field_errors`.
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-004
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: status_code_conformance
    methods:
    - POST
    - PATCH
    operations:
    - PATCH /api/v1/assets/user-assets/{asset_id}/
    - PATCH /api/v1/workspaces/{slug}/projects/{project_id}/cycles/{pk}/
    - PATCH /api/v1/workspaces/{slug}/projects/{project_id}/members/{pk}/
    - PATCH /api/v1/workspaces/{slug}/projects/{project_id}/project-members/{pk}/
    - PATCH /api/v1/workspaces/{slug}/stickies/{pk}/
    - POST /api/v1/workspaces/{slug}/invitations/
    - POST /api/v1/workspaces/{slug}/projects/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/cycles/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/members/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/project-members/
    message_regex: 'Received: 400'
  reason: Invalid request bodies return 400, which the schema does not list for these create/update operations.
    Partly measures the fixture (research/0005, PQ-056, PQ-314) because the seeded projects have cycle_view switched
    off, so every cycle create or PATCH answers the same 400 `non_field_errors` and those success shapes were never exercised.
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-005
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: status_code_conformance
    operations:
    - GET /api/v1/workspaces/{slug}/invitations/{pk}/
    - PATCH /api/v1/workspaces/{slug}/invitations/{pk}/
    message_regex: 'Received: 404'
  reason: Invitations detail/update return 404 for an unknown id; the schema documents only 200 (these viewset routes
    are undecorated).
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-006
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: response_schema_conformance
    failure_type: JsonSchemaError
    operations:
    - GET /api/v1/users/me/
    - GET /api/v1/workspaces/{slug}/members/
    - GET /api/v1/workspaces/{slug}/projects-lite/
    - GET /api/v1/workspaces/{slug}/projects/
    - GET /api/v1/workspaces/{slug}/projects/{pk}/
    - PATCH /api/v1/workspaces/{slug}/projects/{pk}/
    message_regex: null is not of type
  reason: 'Responses contain null for fields the schema declares as a non-nullable string (e.g. avatar_url, cover_image_url).
    A client built from the schema would reject real responses. If the Rust schema declares these nullable, the
    oasdiff gate will report a break: reproduce the BEHAVIOUR and record a schema-diff exception.'
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-007
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: response_schema_conformance
    failure_type: JsonSchemaError
    operations:
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/{issue_id}/activities/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/{issue_id}/links/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/{pk}/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/{issue_id}/links/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/{pk}/
    message_regex: is a required property
  reason: The `fields` (and `expand`) query parameters project the response, so required properties are legitimately
    absent. The schema does not model projection. Seen on work-item detail and the activities/links sub-resources.
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-008
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: response_schema_conformance
    failure_type: JsonSchemaError
    operations:
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/members/{pk}/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/project-members/{pk}/
    message_regex: '"member" is a required property'
  reason: 'Project-member detail responses (no query parameters) lack the `member` property that the schema marks
    required: the schema describes a different shape from what is served.'
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-009
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: response_schema_conformance
    failure_type: JsonSchemaError
    operations:
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/{issue_id}/issue-attachments/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/members/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/project-members/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/{issue_id}/attachments/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/cycles/{cycle_id}/cycle-issues/
    - POST /api/v1/workspaces/{slug}/projects/{project_id}/modules/{module_id}/module-issues/
    message_regex: is not of type \"object\"
  reason: Plane returns a bare JSON array where the schema documents an object (project members lists, attachments
    lists, cycle-issues / module-issues add). A new implementation must return an array, not the documented object.
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-010
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: response_schema_conformance
    failure_type: JsonSchemaError
    operations:
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/{issue_id}/activities/{pk}/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/{issue_id}/links/{pk}/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/{issue_id}/activities/{pk}/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/{issue_id}/links/{pk}/
    - GET /api/v1/workspaces/{slug}/stickies/
    - POST /api/v1/workspaces/{slug}/stickies/
  reason: The schema documents a Paginated* envelope where Plane returns a single object (links/{pk}, activities/{pk})
    and the sticky list/create bodies do not match their documented schema. Causes (research/0005, PQ-307, PQ-308) are
    a drf-spectacular component-name collision on `Sticky` for the sticky mismatch, and a decorator documenting a dead
    `pk is None` branch for the link and activity detail mismatch.
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-011
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: response_schema_conformance
    failure_type: JsonSchemaError
    operations:
    - GET /api/v1/workspaces/{slug}/issues/search/
    - GET /api/v1/workspaces/{slug}/work-items/search/
    message_regex: '"id" is a required property'
  reason: The schema documents a flat `IssueSearch` whose items require `id`, but the body is an object wrapping the
    results under an `issues` key (PQ-309). The results DO carry `id` (corpus work_items.json#search), so the failure is
    the wrapper and not a missing key. Corrected in round 27 (research/0005), which had said the results omit `id`.
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-012
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  optional: false
  match:
    check: response_schema_conformance
    failure_type: JsonSchemaError
    operations:
    - PATCH /api/v1/workspaces/{slug}/projects/{project_id}/modules/{pk}/
    message_regex: Validated against the response schema for status code 400
  reason: 'The documented 400 response of module PATCH references the Module resource schema, so a real error body
    ({"error": ...}) can never validate against it.'
  evidence: gate run on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic (oracle/results/conformance-baseline.json)
  rust_expectation: reproduce
  deviation_ref: null
- id: EX-013
  kind: upstream-schema-defect
  applies_to: conformance
  status: active
  # Found by the scoped run (thrust issue #58), not by the whole-schema baseline, and it needs the fuzzer to send `expand`: fuzz luck
  # in a whole-schema run, so optional there. A scope that lists it in `entry_operations` still requires it to fire.
  optional: true
  match:
    check: response_schema_conformance
    failure_type: JsonSchemaError
    operations:
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/issues/{pk}/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/
    - GET /api/v1/workspaces/{slug}/projects/{project_id}/work-items/{pk}/
    message_regex: is not valid under any of the schemas listed in the 'anyOf' keyword
  reason: With `expand=assignees` (or `labels`, `state`) the response holds objects where the schema declares the ids
    (an assignee as `{avatar, avatar_url, display_name, email, first_name, id, last_name}` against a uuid string). The schema does
    not model expansion, as it does not model `fields` (EX-007). A client built from the schema would reject a response it asked for.
  evidence: scoped run (m1) on a fresh seed, pinned commit ba85d4d3d3, schemathesis 4.31.1, seed 1, deterministic, 2026-11-10
  rust_expectation: reproduce
  deviation_ref: null
# EX-014 (Thrust-only: a slug that is empty because the fold was missing) was removed when `slugify` came to fold under NFKD as the pin's
# does (D-031 (2), thrust issue #58). The number is not reused. A name with nothing foldable has an empty slug on the pin as well, and that
# is the pin's, not a difference.

# --- the corpus comparison (harness/compare_corpus.py): what a recording of Thrust may differ in from the committed corpus ----------
# `match.resource` names a recorded resource (or a list of them), `exchanges` the exchanges (any when absent), and `path_regex` the JSON
# path of a difference (`$.response.body...`). An entry of `kind: ordering` has an `array_path_regex` over the path with its array
# indexes erased and accepts a REORDERING of such an array, and nothing else. All are Thrust's, so a recording of the pin does not hold them.
- id: EX-C01
  kind: intentional-deviation
  applies_to: corpus
  targets: [thrust]
  status: active
  optional: false
  match:
    resource: projects
    exchanges: [list, list-per-page-1, list-order-by-name, detail, detail-by-pk-route, list-archived-visible]
    path_regex: '\.total_(cycles|modules)$'
  reason: >-
    Thrust has no cycles and no modules, so a project has none (`total_cycles` and `total_modules` are 0); the oracle's seeded project
    has one of each.
  evidence: corpus comparison on Thrust native-memory, 2026-11-10
  rust_expectation: n/a
  deviation_ref: D-030
- id: EX-C02
  kind: intentional-deviation
  applies_to: corpus
  targets: [thrust]
  status: active
  optional: false
  match:
    resource: errors
    exchanges: [invalid-json-body]
    path_regex: '\.body\.detail$'
  reason: >-
    A body that is not JSON is refused as the pin refuses it (400, `JSON parse error - ...`), with the words of Rust's parser, which
    are not Python's.
  evidence: corpus comparison on Thrust native-memory, 2026-11-10
  rust_expectation: n/a
  deviation_ref: D-030
- id: EX-C03
  kind: ordering
  applies_to: corpus
  targets: [thrust]
  status: active
  optional: false
  match:
    resource: work_items
    exchanges: [list-order-by-priority-desc]
    array_path_regex: '^\$\.response\.body\.results$'
  reason: >-
    The work items that tie on the order asked for come newest first here and in the database's order on the pin (the corpus's
    items one to nine are all of priority `none` in the part of the list that ties). The same items are listed, in another order.
  evidence: corpus comparison on Thrust native-memory, 2026-11-10
  rust_expectation: n/a
  deviation_ref: D-033
- id: EX-C04
  kind: ordering
  applies_to: corpus
  targets: [thrust]
  status: active
  optional: false
  match:
    resource: [work_items, pagination]
    array_path_regex: '^\$\.response\.body\.results\[\]\.(assignees|labels)$'
  reason: >-
    The people a work item is assigned to and its labels are listed by id here, and newest first on the pin (the corpus's item four has
    `[member, owner]` and Thrust `[owner, member]`). The same people are listed, in another order. Confirmed by the owner as a
    deviation, 2026-11-10 (D-034).
