name: deploy-worker
description: >-
  Deploy the attested bundle of one commit to one environment and prove it: verify the attestation, install the pinned tools, then run
  scripts/deploy-worker.sh (render, classify, expand migration, wrangler deploy, smoke, rollback). Used by the `deploy` job and, with
  the manual gate, by `deploy-do` (issue #49, ADR-0110 round 29).

# Everything the script reads comes in as an input and goes to the script through env, never into the text of a `run:` (an input is
# data, not code). The credentials are inputs too, because a composite action cannot read the `secrets` context: the CALLER passes
# them from its environment. They are in the environment of ONE step only (the last), and scripts/deploy-worker.sh hands each to
# the process that needs it and to no other.

inputs:
  environment:
    description: staging or production (the name of the GitHub environment, without `-do-lifecycle`)
    required: true
  sha:
    description: The commit, 40 hex digits. The bundle it built is `deploy-bundle-<sha>`
    required: true
  allow-do-lifecycle:
    description: "'true' only in the manual-gated job: the first deploy and a Durable Object lifecycle change go through; no automatic rollback"
    required: false
    default: "false"
  inject-smoke-failure:
    description: "'true' makes the smoke fail on purpose after it passed, to prove the rollback. Staging only"
    required: false
    default: "false"
  skip-smoke:
    description: "'true' deploys without the smoke: the first deploy of an environment only"
    required: false
    default: "false"
  wrangler-version:
    description: Exact wrangler version, installed with `npm install --global`. Kept equal to setup-rust's by .github/scripts/tests/test-workflows.sh
    required: false
    default: "4.151.2"
  # ---- the environment's variables (none is secret)
  cloudflare-account-id:
    description: "Cloudflare account id"
    required: true
  worker-name:
    description: "The Worker's name"
    required: true
  base-url:
    description: "https://<hostname> of the Worker's Custom Domain"
    required: true
  hyperdrive-id:
    description: "The Hyperdrive config's id"
    required: true
  r2-bucket:
    description: "The R2 bucket"
    required: true
  queue:
    description: "The queue"
    required: true
  queue-dlq:
    description: "Its dead-letter queue"
    required: true
  rl-signin-id:
    description: "Rate-limit namespace id"
    required: true
  rl-v1-id:
    description: "Rate-limit namespace id"
    required: true
  csrf-enforce:
    description: "on or off: no default, so turning it on is a decision"
    required: true
  db-access-hostname:
    description: "The hostname of the Access application in front of thrust-pg"
    required: true
  smoke-email:
    description: "The smoke account's email"
    required: true
  smoke-workspace:
    description: "The slug of the smoke account's workspace"
    required: true
  smoke-project:
    description: "The project the smoke must find listed"
    required: false
    default: "smoke"
  # ---- the environment's secrets (the caller passes them from its `secrets` context)
  cloudflare-api-token:
    description: "A Cloudflare API token scoped to Workers scripts"
    required: true
  tunnel-service-token-id:
    description: "The Access service token's id, for cloudflared"
    required: true
  tunnel-service-token-secret:
    description: "The Access service token's secret, for cloudflared"
    required: true
  database-url:
    description: "postgres://<role>:<password>@127.0.0.1:15432/thrust, the local end of the tunnel"
    required: true
  smoke-password:
    description: "The smoke account's password"
    required: true

outputs:
  deferred:
    description: "'true' when nothing was deployed because this deploy needs the manual gate"
    value: ${{ steps.deploy.outputs.deferred }}
  deployed:
    description: "'true' when wrangler deployed the version"
    value: ${{ steps.deploy.outputs.deployed }}
  rolled_back:
    description: no, yes, failed or unverified
    value: ${{ steps.deploy.outputs.rolled_back }}

runs:
  using: composite
  steps:
    - name: Preflight - the tools the deploy needs are on the runner
      shell: bash
      run: |
        missing=""
        for tool in git curl nc python3 tar sha256sum gh npm jq unzip; do
          command -v "$tool" > /dev/null 2>&1 || missing="$missing $tool"
        done
        if [ -n "$missing" ]; then
          echo "::error::runner image lacks:$missing"
          exit 1
        fi

    - name: Fetch the bundle that was built and attested
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: deploy-bundle-${{ inputs.sha }}
        path: ${{ runner.temp }}/bundle-download

    # The attestation is the proof that this file came out of THIS repository's deploy workflow on main, and was not put there by
    # anything else that can write an artifact. `source-digest` is not asked for: on a workflow_run the workflow's own commit is the
    # tip of main and not the commit ci ran on, so the commit is bound another way: the bundle names the commit it was built from
    # (BUILD_SHA, inside the attested file) and that is compared below.
    - name: Verify the attestation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BUNDLE_DIR: ${{ runner.temp }}/bundle-download
      run: .github/scripts/verify-bundle.sh "$BUNDLE_DIR/deploy-bundle.tar.gz" "$REPO"

    - name: Unpack the bundle
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
        BUNDLE_DIR: ${{ runner.temp }}/bundle-download
        UNPACK_DIR: ${{ runner.temp }}/bundle
        TOOLS_DIR: ${{ runner.temp }}/tools
      run: |
        set -eu
        # plain files only, no path that leaves the directory, and BUILD_SHA equal to this commit (.github/scripts/unpack-bundle.sh)
        mkdir -p "$TOOLS_DIR"
        .github/scripts/unpack-bundle.sh "$BUNDLE_DIR/deploy-bundle.tar.gz" "$UNPACK_DIR" "$SHA"
        # worker-build writes the whole of build/: the shim imports ../index.js, which imports index_bg.wasm, so all three have to be there;
        # web/ is the build of the web app, which this deploy serves and whose last release's files it keeps (ADR-0011)
        for f in build/worker/shim.mjs build/index.js build/index_bg.wasm web/index.html; do
          test -s "$UNPACK_DIR/$f" || { echo "::error::the bundle has no $f"; exit 1; }
        done
        test -x "$UNPACK_DIR/migrate" || { echo "::error::the bundle has no migrate binary"; exit 1; }
        rm -rf crates/thrust-worker/build
        cp -R "$UNPACK_DIR/build" crates/thrust-worker/build
        cp "$UNPACK_DIR/migrate" "$TOOLS_DIR/migrate"

    - name: Install wrangler (exact version)
      shell: bash
      env:
        WRANGLER_VERSION: ${{ inputs.wrangler-version }}
      run: npm install --global "wrangler@${WRANGLER_VERSION}"

    # cloudflared reaches thrust-pg through the Access tunnel (scripts/migrate-ci.sh). It is a release binary of cloudflare/cloudflared,
    # pinned by version AND by its SHA-256 (taken from the release and checked against a download of it on 2026-11-14).
    - name: Install cloudflared (pinned, checksum verified)
      shell: bash
      env:
        CLOUDFLARED_VERSION: "2026.10.7"
        CLOUDFLARED_SHA256: "1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872"
        TOOLS_DIR: ${{ runner.temp }}/tools
      run: |
        set -eu
        mkdir -p "$TOOLS_DIR"
        curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 5 \
          --output "$TOOLS_DIR/cloudflared" \
          "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
        echo "${CLOUDFLARED_SHA256}  ${TOOLS_DIR}/cloudflared" | sha256sum --check --strict
        chmod +x "$TOOLS_DIR/cloudflared"
        echo "$TOOLS_DIR" >> "$GITHUB_PATH"

    - name: Deploy and prove
      id: deploy
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.environment }}
        DEPLOY_SHA: ${{ inputs.sha }}
        ALLOW_DO_LIFECYCLE: ${{ inputs.allow-do-lifecycle }}
        # a deploy that crosses a lifecycle change never rolls back by itself (scripts/deploy-worker.sh decides); this is the other half
        AUTO_ROLLBACK: ${{ inputs.allow-do-lifecycle == 'true' && 'false' || 'true' }}
        INJECT_SMOKE_FAILURE: ${{ inputs.inject-smoke-failure }}
        SKIP_SMOKE: ${{ inputs.skip-smoke }}
        THRUST_BASE_URL: ${{ inputs.base-url }}
        THRUST_WORKER_NAME: ${{ inputs.worker-name }}
        THRUST_HYPERDRIVE_ID: ${{ inputs.hyperdrive-id }}
        THRUST_R2_BUCKET: ${{ inputs.r2-bucket }}
        THRUST_QUEUE: ${{ inputs.queue }}
        THRUST_QUEUE_DLQ: ${{ inputs.queue-dlq }}
        THRUST_RL_SIGNIN_ID: ${{ inputs.rl-signin-id }}
        THRUST_RL_V1_ID: ${{ inputs.rl-v1-id }}
        THRUST_CSRF_ENFORCE: ${{ inputs.csrf-enforce }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        # the expand step (scripts/migrate-ci.sh)
        DB_ACCESS_HOSTNAME: ${{ inputs.db-access-hostname }}
        TUNNEL_SERVICE_TOKEN_ID: ${{ inputs.tunnel-service-token-id }}
        TUNNEL_SERVICE_TOKEN_SECRET: ${{ inputs.tunnel-service-token-secret }}
        DATABASE_URL: ${{ inputs.database-url }}
        DATABASE_SSLROOTCERT: ${{ github.workspace }}/.github/deploy/cloudflare-origin-ca-rsa-root.pem
        MIGRATE_BIN: ${{ runner.temp }}/tools/migrate
        # the web app of this commit, and the token that finds and verifies the previous release's bundle (read-only: `actions: read`,
        # `attestations: read`). GITHUB_REPOSITORY is the runner's own. scripts/deploy-worker.sh gives the token to that one step only.
        NEW_ASSETS_DIR: ${{ runner.temp }}/bundle/web
        GH_TOKEN: ${{ github.token }}
        # the smoke (scripts/smoke-deploy.sh)
        SMOKE_EMAIL: ${{ inputs.smoke-email }}
        SMOKE_PASSWORD: ${{ inputs.smoke-password }}
        SMOKE_WORKSPACE: ${{ inputs.smoke-workspace }}
        SMOKE_PROJECT: ${{ inputs.smoke-project }}
      run: scripts/deploy-worker.sh
