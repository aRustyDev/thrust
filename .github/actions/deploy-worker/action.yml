name: deploy-worker
description: >-
  Deploy the attested bundle of one commit to one environment and prove it: verify the attestation, install the pinned tools, then run
  scripts/deploy-worker.sh (render, classify, expand migration, wrangler deploy, smoke, rollback). Used by the `deploy` job and, with
  the manual gate, by `deploy-do` (issue #49, ADR-0110 round 29); with `script`, by the target jobs (scripts/deploy-target.sh) and
  by `deploy-edge` (scripts/deploy-edge.sh, the edge Worker from the same bundle).

# Everything the script reads comes in as an input and goes to the script through env, never into the text of a `run:` (an input is
# data, not code). The credentials are inputs too, because a composite action cannot read the `secrets` context: the CALLER passes
# them from its environment. They are in the environment of ONE step only (the last), and scripts/deploy-worker.sh hands each to
# the process that needs it and to no other.

inputs:
  script:
    description: >-
      `worker` (the default): scripts/deploy-worker.sh, a deploy of the environment's Worker. `target`: scripts/deploy-target.sh, a
      Worker Preview of the production Worker reached through the edge (ADR-0111), with the target-* inputs below. `edge`:
      scripts/deploy-edge.sh, the edge Worker of the release's bundle in front of production, with the edge-* inputs below
    required: false
    default: worker
  environment:
    description: staging or production (the name of the GitHub environment, without `-do-lifecycle`)
    required: true
  sha:
    description: The commit, 40 hex digits. The bundle it built is `deploy-bundle-<sha>`
    required: true
  release-tag:
    description: >-
      Production: the release tag (v<version>) whose attached bundle is deployed, release.yml's build at the tag. Empty (staging): the
      artifact `deploy-bundle-<sha>` that this run's `build` job made
    required: false
    default: ""
  allow-do-lifecycle:
    description: "'true' only in the manual-gated job: the first deploy and a Durable Object lifecycle change go through; no automatic rollback"
    required: false
    default: "false"
  inject-smoke-failure:
    description: "'true' makes the smoke fail on purpose after it passed, to prove the rollback. Staging only"
    required: false
    default: "false"
  skip-smoke:
    description: "'true' deploys without the smoke: the first deploy of an environment only"
    required: false
    default: "false"
  wrangler-version:
    description: Exact wrangler version, installed with `npm install --global`. Kept equal to setup-rust's by .github/scripts/tests/test-workflows.sh
    required: false
    default: "4.151.2"
  # ---- the environment's variables (none is secret)
  cloudflare-account-id:
    description: "Cloudflare account id"
    required: true
  worker-name:
    description: "The Worker's name"
    required: true
  base-url:
    description: "https://<hostname> of the Worker's Custom Domain"
    required: true
  hyperdrive-id:
    description: "The Hyperdrive config's id"
    required: true
  r2-bucket:
    description: "The R2 bucket"
    required: true
  queue:
    description: "The queue"
    required: true
  queue-dlq:
    description: "Its dead-letter queue"
    required: true
  rl-signin-id:
    description: "Rate-limit namespace id"
    required: true
  rl-v1-id:
    description: "Rate-limit namespace id"
    required: true
  csrf-enforce:
    description: "on or off: no default, so turning it on is a decision"
    required: true
  email-from:
    description: "The address the password reset mails are sent from: one plain lowercase address on a domain the account has Email Sending enabled for. No default: an environment that mails has chosen who it mails as"
    required: true
  db-access-hostname:
    description: "The hostname of the Access application in front of thrust-pg"
    required: true
  smoke-email:
    description: "The smoke account's email"
    required: true
  smoke-workspace:
    description: "The slug of the smoke account's workspace"
    required: true
  smoke-project:
    description: "The project the smoke must find listed"
    required: false
    default: "smoke"
  # ---- the environment's secrets (the caller passes them from its `secrets` context)
  cloudflare-api-token:
    description: "A Cloudflare API token scoped to Workers scripts"
    required: true
  tunnel-service-token-id:
    description: "The Access service token's id, for cloudflared"
    required: true
  tunnel-service-token-secret:
    description: "The Access service token's secret, for cloudflared"
    required: true
  database-url:
    description: "postgres://<role>:<password>@127.0.0.1:15432/thrust, the local end of the tunnel"
    required: true
  smoke-password:
    description: "The smoke account's password"
    required: true

  # a target (script: target) only
  target-name:
    description: "The target's name (vX.Y.Z for a release candidate)"
    required: false
    default: ""
  target-kind:
    description: "A target kind of .github/deploy/flagship/policy.json"
    required: false
    default: rc
  target-audience:
    description: "The opt-in path the target's smoke uses"
    required: false
    default: rc
  target-expires:
    description: "YYYY-MM-DDTHH:MM:SSZ, when the target may be removed"
    required: false
    default: ""
  target-alias:
    description: "An alias of the policy to point at the target once it is proved (staging), or empty"
    required: false
    default: ""
  allow-migrate:
    description: "'true' only in the job whose environment has reviewers: expand production's schema before the target (no contract migration)"
    required: false
    default: "false"
  flagship-app-id:
    description: "The Flagship app's id"
    required: false
    default: ""
  preview-host-suffix:
    description: "-<worker>.<subdomain>.workers.dev, what a target's URL ends with (the edge's PREVIEW_HOST_SUFFIX)"
    required: false
    default: ""
  flagship-api-token:
    description: "An app-scoped Flagship token that may write the app's flags"
    required: false
    default: ""
  edge-ci-client-id:
    description: "The CI opt-in service token's id (Access, on the edge's opt-in paths)"
    required: false
    default: ""
  edge-ci-client-secret:
    description: "The CI opt-in service token's secret"
    required: false
    default: ""

  # the edge (script: edge) only; flagship-app-id above is the edge's too
  edge-worker-name:
    description: "The edge Worker's name (thrust-edge), not production's"
    required: false
    default: ""
  access-team-domain:
    description: "<team>.cloudflareaccess.com: the issuer of the Access tokens the edge verifies on its opt-in paths"
    required: false
    default: ""
  access-aud-rc:
    description: "The AUD tag of the Access application on /_edge/opt-in/rc"
    required: false
    default: ""
  access-aud-dev:
    description: "The AUD tag of the Access application on /_edge/opt-in/dev"
    required: false
    default: ""
  workers-dev-subdomain:
    description: "The account's workers.dev subdomain, where production's Previews are"
    required: false
    default: ""
  edge-pin-key:
    description: "The pin's HMAC key, at least 32 bytes"
    required: false
    default: ""
  preview-access-client-id:
    description: "The service token the edge shows Access on the Previews: its id"
    required: false
    default: ""
  preview-access-client-secret:
    description: "The service token the edge shows Access on the Previews: its secret"
    required: false
    default: ""
outputs:
  deferred:
    description: "'true' when nothing was deployed because this deploy needs the manual gate (a target: migrations wait for a reviewer)"
    value: ${{ steps.deploy.outputs.deferred || steps.target.outputs.deferred }}
  deployed:
    description: "'true' when wrangler deployed the version"
    value: ${{ steps.deploy.outputs.deployed || steps.edge.outputs.deployed }}
  rolled_back:
    description: no, yes, failed or unverified
    value: ${{ steps.deploy.outputs.rolled_back || steps.edge.outputs.rolled_back }}

runs:
  using: composite
  steps:
    - name: Preflight - the tools the deploy needs are on the runner
      shell: bash
      env:
        SCRIPT: ${{ inputs.script }}
      run: |
        case "$SCRIPT" in
          worker|target|edge) ;;
          *) echo "::error::script is worker, target or edge, not '$SCRIPT'"; exit 1 ;;
        esac
        missing=""
        for tool in git curl nc python3 tar sha256sum gh npm jq unzip; do
          command -v "$tool" > /dev/null 2>&1 || missing="$missing $tool"
        done
        if [ -n "$missing" ]; then
          echo "::error::runner image lacks:$missing"
          exit 1
        fi

    - name: Fetch the bundle this run built and attested (staging)
      if: inputs.release-tag == ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: deploy-bundle-${{ inputs.sha }}
        path: ${{ runner.temp }}/bundle-download

    # Production deploys what its release carries: published, immutable, and the very asset GitHub's release attestation names
    # (.github/scripts/fetch-release-bundle.sh). The run is on the release's own tag (plan-deploy.sh), and the two must agree.
    - name: Fetch the bundle of the release (production)
      if: inputs.release-tag != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ inputs.release-tag }}
        RUN_REF: ${{ github.ref }}
        BUNDLE_DIR: ${{ runner.temp }}/bundle-download
      run: |
        set -eu
        test "$RUN_REF" = "refs/tags/$TAG" || { echo "::error::the run is on $RUN_REF, not on the release tag $TAG"; exit 1; }
        .github/scripts/fetch-release-bundle.sh "$REPO" "$TAG" "$BUNDLE_DIR"

    # The attestation is the proof that this file was built by THIS repository's workflow for this run's own ref: deploy.yml's `build`
    # job in this same run for an rc/* branch (staging), release.yml at the tag for a v* tag (production). Nothing else that can write an
    # artifact or a release asset can make one. The commit is bound another way: the bundle names the commit it was built from
    # (BUILD_SHA, inside the attested file) and that is compared below.
    - name: Verify the attestation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SOURCE_REF: ${{ github.ref }}
        BUNDLE_DIR: ${{ runner.temp }}/bundle-download
      run: .github/scripts/verify-bundle.sh "$BUNDLE_DIR/deploy-bundle.tar.gz" "$REPO" "$SOURCE_REF"

    - name: Unpack the bundle
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
        BUNDLE_DIR: ${{ runner.temp }}/bundle-download
        UNPACK_DIR: ${{ runner.temp }}/bundle
        TOOLS_DIR: ${{ runner.temp }}/tools
      run: |
        set -eu
        # plain files only, no path that leaves the directory, and BUILD_SHA equal to this commit (.github/scripts/unpack-bundle.sh)
        mkdir -p "$TOOLS_DIR"
        .github/scripts/unpack-bundle.sh "$BUNDLE_DIR/deploy-bundle.tar.gz" "$UNPACK_DIR" "$SHA"
        # worker-build writes the whole of build/: the shim imports ../index.js, which imports index_bg.wasm, so all three have to be there;
        # web/ is the build of the web app, which this deploy serves and whose last release's files it keeps (ADR-0011)
        for f in build/worker/shim.mjs build/index.js build/index_bg.wasm web/index.html; do
          test -s "$UNPACK_DIR/$f" || { echo "::error::the bundle has no $f"; exit 1; }
        done
        test -x "$UNPACK_DIR/migrate" || { echo "::error::the bundle has no migrate binary"; exit 1; }
        rm -rf crates/worker/build
        cp -R "$UNPACK_DIR/build" crates/worker/build
        cp "$UNPACK_DIR/migrate" "$TOOLS_DIR/migrate"

    # The edge's build, from the same attested bundle (edge/build/, .github/actions/build-bundle), where its rendered configuration
    # (crates/edge/.wrangler.deploy.run.toml) points: the shim imports ../index.js, which imports index_bg.wasm.
    - name: Put the edge's build beside its configuration (edge)
      if: inputs.script == 'edge'
      shell: bash
      env:
        UNPACK_DIR: ${{ runner.temp }}/bundle
      run: |
        set -eu
        for f in edge/build/worker/shim.mjs edge/build/index.js edge/build/index_bg.wasm; do
          test -s "$UNPACK_DIR/$f" || { echo "::error::the bundle has no $f (it was built before the bundle carried the edge)"; exit 1; }
        done
        rm -rf crates/edge/build
        cp -R "$UNPACK_DIR/edge/build" crates/edge/build

    - name: Install wrangler (exact version)
      shell: bash
      env:
        WRANGLER_VERSION: ${{ inputs.wrangler-version }}
      run: npm install --global "wrangler@${WRANGLER_VERSION}"

    # cloudflared reaches thrust-pg through the Access tunnel (scripts/migrate-ci.sh). It is a release binary of cloudflare/cloudflared,
    # pinned by version AND by its SHA-256 (taken from the release and checked against a download of it on 2026-11-14).
    - name: Install cloudflared (pinned, checksum verified)
      # the edge reaches no database
      if: inputs.script != 'edge'
      shell: bash
      env:
        CLOUDFLARED_VERSION: "2026.10.7"
        CLOUDFLARED_SHA256: "1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872"
        TOOLS_DIR: ${{ runner.temp }}/tools
      run: |
        set -eu
        mkdir -p "$TOOLS_DIR"
        curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 5 \
          --output "$TOOLS_DIR/cloudflared" \
          "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
        echo "${CLOUDFLARED_SHA256}  ${TOOLS_DIR}/cloudflared" | sha256sum --check --strict
        chmod +x "$TOOLS_DIR/cloudflared"
        echo "$TOOLS_DIR" >> "$GITHUB_PATH"

    - name: Deploy and prove
      if: inputs.script == 'worker'
      id: deploy
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.environment }}
        DEPLOY_SHA: ${{ inputs.sha }}
        ALLOW_DO_LIFECYCLE: ${{ inputs.allow-do-lifecycle }}
        # a deploy that crosses a lifecycle change never rolls back by itself (scripts/deploy-worker.sh decides); this is the other half
        AUTO_ROLLBACK: ${{ inputs.allow-do-lifecycle == 'true' && 'false' || 'true' }}
        INJECT_SMOKE_FAILURE: ${{ inputs.inject-smoke-failure }}
        SKIP_SMOKE: ${{ inputs.skip-smoke }}
        THRUST_BASE_URL: ${{ inputs.base-url }}
        THRUST_WORKER_NAME: ${{ inputs.worker-name }}
        THRUST_HYPERDRIVE_ID: ${{ inputs.hyperdrive-id }}
        THRUST_R2_BUCKET: ${{ inputs.r2-bucket }}
        THRUST_QUEUE: ${{ inputs.queue }}
        THRUST_QUEUE_DLQ: ${{ inputs.queue-dlq }}
        THRUST_RL_SIGNIN_ID: ${{ inputs.rl-signin-id }}
        THRUST_RL_V1_ID: ${{ inputs.rl-v1-id }}
        THRUST_CSRF_ENFORCE: ${{ inputs.csrf-enforce }}
        THRUST_EMAIL_FROM: ${{ inputs.email-from }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        # the expand step (scripts/migrate-ci.sh)
        DB_ACCESS_HOSTNAME: ${{ inputs.db-access-hostname }}
        TUNNEL_SERVICE_TOKEN_ID: ${{ inputs.tunnel-service-token-id }}
        TUNNEL_SERVICE_TOKEN_SECRET: ${{ inputs.tunnel-service-token-secret }}
        DATABASE_URL: ${{ inputs.database-url }}
        DATABASE_SSLROOTCERT: ${{ github.workspace }}/.github/deploy/cloudflare-origin-ca-rsa-root.pem
        MIGRATE_BIN: ${{ runner.temp }}/tools/migrate
        # the web app of this commit, and the token that finds and verifies the previous release's bundle (read-only: `actions: read`,
        # `attestations: read`). GITHUB_REPOSITORY is the runner's own. scripts/deploy-worker.sh gives the token to that one step only.
        NEW_ASSETS_DIR: ${{ runner.temp }}/bundle/web
        GH_TOKEN: ${{ github.token }}
        # the smoke (scripts/smoke-deploy.sh)
        SMOKE_EMAIL: ${{ inputs.smoke-email }}
        SMOKE_PASSWORD: ${{ inputs.smoke-password }}
        SMOKE_WORKSPACE: ${{ inputs.smoke-workspace }}
        SMOKE_PROJECT: ${{ inputs.smoke-project }}
      run: scripts/deploy-worker.sh

    # A target (ADR-0111): a Worker Preview of the production Worker, its flag, and the smoke through the edge. It sees the production
    # Worker's variables (its configuration is production's, derived) and only the secrets a target needs; the database's only when
    # allow-migrate is true, which only the reviewer-gated job passes. scripts/deploy-target.sh hands each secret to one step.
    - name: Deploy the target and prove it
      if: inputs.script == 'target'
      id: target
      shell: bash
      env:
        TARGET_NAME: ${{ inputs.target-name }}
        TARGET_KIND: ${{ inputs.target-kind }}
        TARGET_AUDIENCE: ${{ inputs.target-audience }}
        TARGET_EXPIRES: ${{ inputs.target-expires }}
        TARGET_ALIAS: ${{ inputs.target-alias }}
        ALLOW_MIGRATE: ${{ inputs.allow-migrate }}
        DEPLOY_SHA: ${{ inputs.sha }}
        THRUST_BASE_URL: ${{ inputs.base-url }}
        THRUST_WORKER_NAME: ${{ inputs.worker-name }}
        THRUST_HYPERDRIVE_ID: ${{ inputs.hyperdrive-id }}
        THRUST_R2_BUCKET: ${{ inputs.r2-bucket }}
        THRUST_QUEUE: ${{ inputs.queue }}
        THRUST_QUEUE_DLQ: ${{ inputs.queue-dlq }}
        THRUST_RL_SIGNIN_ID: ${{ inputs.rl-signin-id }}
        THRUST_RL_V1_ID: ${{ inputs.rl-v1-id }}
        THRUST_CSRF_ENFORCE: ${{ inputs.csrf-enforce }}
        THRUST_EMAIL_FROM: ${{ inputs.email-from }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        FLAGSHIP_APP_ID: ${{ inputs.flagship-app-id }}
        FLAGSHIP_API_TOKEN: ${{ inputs.flagship-api-token }}
        PREVIEW_HOST_SUFFIX: ${{ inputs.preview-host-suffix }}
        EDGE_CI_CLIENT_ID: ${{ inputs.edge-ci-client-id }}
        EDGE_CI_CLIENT_SECRET: ${{ inputs.edge-ci-client-secret }}
        # the expand step (scripts/migrate-ci.sh), used only with allow-migrate
        DB_ACCESS_HOSTNAME: ${{ inputs.db-access-hostname }}
        TUNNEL_SERVICE_TOKEN_ID: ${{ inputs.tunnel-service-token-id }}
        TUNNEL_SERVICE_TOKEN_SECRET: ${{ inputs.tunnel-service-token-secret }}
        DATABASE_URL: ${{ inputs.database-url }}
        DATABASE_SSLROOTCERT: ${{ github.workspace }}/.github/deploy/cloudflare-origin-ca-rsa-root.pem
        MIGRATE_BIN: ${{ runner.temp }}/tools/migrate
        NEW_ASSETS_DIR: ${{ runner.temp }}/bundle/web
        # the smoke, through the edge, as production's smoke account (a shared target reads production's data)
        SMOKE_EMAIL: ${{ inputs.smoke-email }}
        SMOKE_PASSWORD: ${{ inputs.smoke-password }}
        SMOKE_WORKSPACE: ${{ inputs.smoke-workspace }}
        SMOKE_PROJECT: ${{ inputs.smoke-project }}
      run: scripts/deploy-target.sh

    # The edge (ADR-0111): the release's edge Worker in front of production, proved on the shared hostname. It sees no database
    # secret and no Flagship token: it writes no flag, it only binds the app. scripts/deploy-edge.sh hands the edge's three secrets
    # to wrangler in a file, and the smoke account's password to the smoke alone.
    - name: Deploy the edge and prove it
      if: inputs.script == 'edge'
      id: edge
      shell: bash
      env:
        DEPLOY_SHA: ${{ inputs.sha }}
        THRUST_BASE_URL: ${{ inputs.base-url }}
        THRUST_WORKER_NAME: ${{ inputs.worker-name }}
        THRUST_EDGE_WORKER_NAME: ${{ inputs.edge-worker-name }}
        THRUST_FLAGSHIP_APP_ID: ${{ inputs.flagship-app-id }}
        THRUST_ACCESS_TEAM_DOMAIN: ${{ inputs.access-team-domain }}
        THRUST_ACCESS_AUD_RC: ${{ inputs.access-aud-rc }}
        THRUST_ACCESS_AUD_DEV: ${{ inputs.access-aud-dev }}
        THRUST_WORKERS_DEV_SUBDOMAIN: ${{ inputs.workers-dev-subdomain }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        EDGE_PIN_KEY: ${{ inputs.edge-pin-key }}
        PREVIEW_ACCESS_CLIENT_ID: ${{ inputs.preview-access-client-id }}
        PREVIEW_ACCESS_CLIENT_SECRET: ${{ inputs.preview-access-client-secret }}
        # always: the edge has no Durable Object or migration that a rollback could cross
        AUTO_ROLLBACK: "true"
        SMOKE_EMAIL: ${{ inputs.smoke-email }}
        SMOKE_PASSWORD: ${{ inputs.smoke-password }}
        SMOKE_WORKSPACE: ${{ inputs.smoke-workspace }}
        SMOKE_PROJECT: ${{ inputs.smoke-project }}
      run: scripts/deploy-edge.sh
