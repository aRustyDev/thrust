name: setup-rust
description: The Rust toolchain rust-toolchain.toml pins, rustup targets, a keyed cache, and (optionally) the pinned Worker toolchain and cargo-nextest. One place to change versions for every job that builds the workspace.

inputs:
  targets:
    description: Comma-separated rustup targets, e.g. wasm32-unknown-unknown
    required: false
    default: ""
  components:
    description: Comma-separated rustup components to add to the toolchain, e.g. clippy, rustfmt (the toolchain is installed without them)
    required: false
    default: ""
  cache-key:
    description: rust-cache shared-key; one per family of jobs that can reuse each other's build output
    required: true
  save-cache:
    description: "'true' to save the cache at the end (set it for the default branch only)"
    required: false
    default: "false"
  nextest:
    description: "'true' to install cargo-nextest at the pinned version: every job that runs a Rust test through it (the hermetic loop, and every job that runs the contract suite)"
    required: false
    default: "false"
  nextest-version:
    description: Exact cargo-nextest version
    required: false
    default: "0.9.140"
  worker-tools:
    description: "'true' to install worker-build and wrangler at the pinned versions"
    required: false
    default: "false"
  worker-build-version:
    description: Exact worker-build version, installed with `cargo install --locked`
    required: false
    default: "0.9.0"
  wrangler-version:
    description: Exact wrangler version, installed with `npm install --global`
    required: false
    default: "4.151.2"

runs:
  using: composite
  steps:
    # The exact version rust-toolchain.toml pins (and nothing else: the script refuses `stable`, `nightly` or a partial version), so
    # every job builds with the compiler a pull request tested. rustup would read the file too, but only once a toolchain is being
    # installed; naming it here makes the install, the cache key and the log say which one. On its own line, so a refusal fails the step.
    - name: The Rust version rust-toolchain.toml pins
      id: toolchain
      shell: bash
      run: |
        channel="$(.github/scripts/toolchain-channel.sh)"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "Rust $channel (rust-toolchain.toml)"

    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    # Restores always; saves only when the caller says so, so many PR cells cannot evict each other's
    # entries from the repository's cache budget. It caches ~/.cargo (including binaries installed AFTER this
    # step; `cache-bin` defaults to true) and ./target, so the worker-build install below needs no cache of
    # its own: it is saved with the rest on the default branch.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' }}

    # A prebuilt binary, checked by the action against its release's checksum; after the cache step, so it is not cached twice.
    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      if: inputs.nextest == 'true'
      with:
        tool: cargo-nextest@${{ inputs.nextest-version }}

    - name: Install worker-build (exact version, locked)
      if: inputs.worker-tools == 'true'
      shell: bash
      env:
        WORKER_BUILD_VERSION: ${{ inputs.worker-build-version }}
      run: cargo install worker-build --locked --version "=${WORKER_BUILD_VERSION}"

    - name: Install wrangler (exact version)
      if: inputs.worker-tools == 'true'
      shell: bash
      env:
        WRANGLER_VERSION: ${{ inputs.wrangler-version }}
      run: npm install --global "wrangler@${WRANGLER_VERSION}"
