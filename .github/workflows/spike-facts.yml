name: spike-facts

# SPIKE for stage 0.2 of the CI split. Not for merging.
# What a called workflow sees of its caller (F1, F2), whether its outputs reach the caller (F6), and whether an artifact it
# uploads can be downloaded by a later job of the caller (F7). The names of its jobs in the check list (F4) are read from the API.

on:
  pull_request:
    paths:
      - .github/workflows/spike-*.yml
      - .github/scripts/spike-*.sh

permissions: {}

jobs:
  call:
    uses: ./.github/workflows/spike-facts-callee.yml
    permissions:
      contents: read

  show:
    needs: call
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      CALLEE_EVENT: ${{ needs.call.outputs.event }}
      CALLEE_WORKFLOW: ${{ needs.call.outputs.workflow }}
      CALLEE_PROBE: ${{ needs.call.outputs.probe }}
      CALLER_EVENT: ${{ github.event_name }}
      CALLER_WORKFLOW: ${{ github.workflow }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spike-marker
          path: marker
      - run: |
          echo "F1 the callee saw event_name=$CALLEE_EVENT; the caller's is $CALLER_EVENT"
          echo "F2 the callee saw workflow=$CALLEE_WORKFLOW; the caller's is $CALLER_WORKFLOW"
          echo "F6 a callee output reached the caller: probe=$CALLEE_PROBE"
          echo "F7 an artifact uploaded in the callee was downloaded in the caller: $(cat marker/marker.txt)"
