name: contract-cell

# Reusable workflow: run ONE cell of the contract matrix on its own runner.
# Why a reusable workflow and not a composite action: a cell needs its own runner, timeout,
# permissions and artifacts (a job), and two callers use it (ci.yml per cell, and anything that
# wants a single cell). Steps shared between jobs live in .github/actions/setup-rust instead.

on:
  workflow_call:
    inputs:
      target:
        description: native-memory | native-pg | worker-memory | worker-cf
        type: string
        required: true
      pass:
        description: main | sweeper | panic | cron | csrfoff | worker | bindings | oracle | e2e
        type: string
        required: true

permissions: {}

jobs:
  cell:
    name: ${{ inputs.target }} ${{ inputs.pass }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # inputs go through env, never interpolated into the script text
      CELL_TARGET: ${{ inputs.target }}
      CELL_PASS: ${{ inputs.pass }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ startsWith(inputs.target, 'worker') && 'wasm32-unknown-unknown' || '' }}
          worker-tools: ${{ startsWith(inputs.target, 'worker') && 'true' || 'false' }}
          cache-key: contract-${{ startsWith(inputs.target, 'worker') && 'wasm' || 'native' }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # The oracle pass runs the v1 oracle's Python harness (scripts/oracle-v1.sh): every script is a `uv run --script` file and
      # Schemathesis is fetched at its pinned version by `uvx`. Only that pass needs uv, and uv itself is pinned, as the action is.
      - name: Install uv (oracle cells)
        if: inputs.pass == 'oracle'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
          enable-cache: false

      # The e2e pass drives the stock app in Chromium (scripts/e2e.sh): Node and pnpm at the versions web/ pins, the app built, the
      # journey's own dependencies at their lockfile, and the browser with the system libraries it needs. Only that pass needs them.
      # Dependency scripts stay off, as in the `web` job: the build does not need them.
      - name: Node (e2e cell)
        if: inputs.pass == 'e2e'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      - name: Build the app, and get the browser (e2e cell)
        if: inputs.pass == 'e2e'
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          want="$(node -p "require('./web/package.json').packageManager.split('@')[1].split('+')[0]")"
          npm install --global "pnpm@$want"
          test "$(pnpm --dir web --version)" = "$want"
          pnpm --dir web install --frozen-lockfile --ignore-scripts
          pnpm --dir web exec turbo run build --filter=web
          test -s web/apps/web/build/client/index.html
          pnpm --dir e2e install --frozen-lockfile --ignore-scripts
          pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Preflight - host tools scripts/contract.sh relies on
        run: |
          missing=""
          tools="curl openssl lsof pgrep docker"
          [ "$CELL_PASS" = oracle ] && tools="$tools uv"
          [ "$CELL_PASS" = e2e ] && tools="$tools node pnpm"
          for tool in $tools; do
            command -v "$tool" > /dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::runner image lacks:$missing"
            exit 1
          fi

      # No pipe, no trailing echo: this step's status IS contract.sh's status. The script also
      # refuses to pass when its test count differs from the expected one and when the target
      # reports a different adapter set than the cell claims.
      - name: Run the cell
        run: scripts/contract.sh "$CELL_TARGET" "$CELL_PASS"

      - name: Record that exactly this cell passed
        run: |
          mkdir -p cell-ok
          printf '%s %s\n' "$CELL_TARGET" "$CELL_PASS" > "cell-ok/${CELL_TARGET}-${CELL_PASS}.ok"

      - name: Upload the pass marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-ok-${{ inputs.target }}-${{ inputs.pass }}
          path: cell-ok/
          if-no-files-found: error
          retention-days: 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ inputs.target }}-${{ inputs.pass }}
          path: target/contract-logs/
          if-no-files-found: ignore
          retention-days: 7
