name: Enable preview provisioner route

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: thrust-preview-provisioner-deployment
  cancel-in-progress: false

jobs:
  enable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: preview-provisioner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify Access and enable route
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_ID: ${{ vars.THRUST_PREVIEW_PROVISIONER_WORKER_ID }}
          WORKER_URL: ${{ vars.THRUST_PREVIEW_PROVISIONER_URL }}
          ACCESS_TOKEN_ID: ${{ vars.PREVIEW_PROVISIONER_ACCESS_TOKEN_ID }}
          ACCESS_CLIENT_ID: ${{ secrets.PREVIEW_PROVISIONER_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.PREVIEW_PROVISIONER_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          credential_file="$RUNNER_TEMP/preview-provisioner-access.json"
          trap 'rm -f "$credential_file"' EXIT
          python3 -c 'import json, os, sys; json.dump({"id": os.environ["ACCESS_TOKEN_ID"], "client_id": os.environ["ACCESS_CLIENT_ID"], "client_secret": os.environ["ACCESS_CLIENT_SECRET"]}, open(sys.argv[1], "x"))' "$credential_file"
          python3 infra/cloudflare/preview-access.py --worker-id "$WORKER_ID" --credentials-file "$credential_file" --enable-url "$WORKER_URL"
