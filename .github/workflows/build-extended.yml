name: build-extended

# The builds that are useful and are not required checks: a compile proof of the native server and `migrate` on macOS (Build phase, stage 3) and on Windows
# (stage 4), the image of the server (stage 5), and the targets that follow them (a BSD build, if the owner wants it here too). The owner's decision of 2026-11-23, about macOS: "I'd prefer if macos build jobs weren't
# required checks. These are useful, but I see them as lower priority checks that should run during either a pre-release check or nightly."
#
# NOT GATED: `ci.yml` does not call this workflow, `gate` does not read it, and a red run blocks nothing (not a pull request, and not a release candidate:
# the staging deploy waits for `ci`'s `gate` and for nothing here). So it has no `plan` and no `verdict`, as deep.yml has none. It runs
#   * every night (06:11 UTC, on `main`), which is also what saves the cache and keeps it from the seven days a repository's unread caches live;
#   * when a release candidate is pushed (`rc/*`: the branch release-plz makes for the release pull request): the pre-release check. release-plz updates that
#     branch after EVERY merge to `main` (it is `main` plus the version bump), so this is a run per merge, not one per release. To make a commit GitHub marks
#     "Verified", release-plz first pushes a twin of the branch, `rc/<time>-tmp-<random>` (the API cannot force-push, so it builds the commit on a new branch,
#     moves the real branch to it and deletes the twin). The twin ends at the same commit as the real branch, so a run for it is a duplicate on a branch that
#     is gone a moment later, and the filter leaves it out (`'!rc/*-tmp-*'`, tried on a probe: the name without `-tmp-` started a run and the twin did not);
#   * by hand;
#   * on a pull request that edits this file, the action it uses (build-native, which `linux` of build.yml uses too) or the image's files (docker/), so that the file is
#     proved before it merges: GitHub dispatches only a workflow that is already on the default branch, as for deep.yml and e2e.yml. No other pull request starts it.
# A red night is a finding for whoever reads the Actions tab, not a red check on anyone's pull request. Scheduled runs are for the default branch only, and
# GitHub disables a schedule in a public repository after 60 days without activity.
#
# `macos` and `windows` are the build-native action's steps on a runner of their own: it checks that the compiler's host is the target the job claims, builds `thrust-server`
# and `migrate` in release with the repository's commands, checks that both exist, and uploads them for three days. Each sets Rust up ITSELF, before the action, with a cache key
# of its own: a cache is not saved when setup-rust is two composite actions deep. `docker` builds docker/Dockerfile (which builds the same two binaries, inside the image, on musl)
# and starts the image once. Nothing is published, signed or attested by any of them.

on:
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * *"
  push:
    branches:
      - rc/*
      - '!rc/*-tmp-*'
  pull_request:
    paths:
      - .github/workflows/build-extended.yml
      - .github/actions/build-native/**
      - docker/**

permissions: {}

# A newer push to the same release candidate, or to the same pull request, replaces the run in flight; a night's run is never replaced by another ref's.
concurrency:
  group: build-extended-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  # aarch64-apple-darwin, on a hosted macOS runner (macos-15: three Apple M1 cores, 7 GB; the standard runners are free in a public repository). Nothing
  # else in CI runs on macOS (the tests and the contract suite are run on a Mac by hand), so a break that only this target sees (a crate that needs an API
  # Linux has and macOS has not, a C dependency that Apple's compiler refuses) would be found at a desk. The first run (#365) built both binaries in 234 s
  # with no cache: the server's release build 173 s, `migrate` 37 s.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust is set up here, one composite deep, so that its post step can save the cache (see the header of build-native).
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build-macos
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/build-native
        with:
          name: macos
          target: aarch64-apple-darwin

  # x86_64-pc-windows-msvc, on a hosted Windows runner (windows-2025: four vCPUs, 16 GB; the standard runners are free in a public repository). Nothing else in CI
  # runs on Windows, and nothing here is developed on it, so a break that only this target sees (an API that only Unix has, a C dependency that does not build
  # with MSVC, a script of the build that cannot run under Git Bash) would be found by the first person to try. Not a required check, as macos is not: that was
  # the owner's decision for macOS, and the Windows build is put here on the same reasoning, until the owner says otherwise. The binaries end in `.exe`.
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build-windows
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/build-native
        with:
          name: windows
          target: x86_64-pc-windows-msvc
          exe: .exe

  # The image of the self-hosted server (docker/Dockerfile: `thrust-server` and `migrate`, static, on distroless; Build phase, stage 5), built and started once. Nothing in CI built an
  # image before, and the repository had no Dockerfile. The build is on the runner's own Docker (28, with Buildx: no action sets it up), and nothing is pushed, signed or attested: no login,
  # no registry, no token. The image is not uploaded either: the Dockerfile and the commit make it again, and the binaries a run uploads are the `linux` job's. Whether it STARTS is the
  # other half of the proof, because an image that builds and cannot run (a library the base lacks, the wrong user, a signal it ignores) is not one a person can use:
  #   * /healthz answers "ok" through a published port (THRUST_LISTEN is baked in as 0.0.0.0:8080: the server's own default, 127.0.0.1, cannot be reached through one);
  #   * the process runs as uid 65532 (read from /proc, the process's own, not the image's declared USER);
  #   * `docker stop` ends it with exit 0 inside five seconds: the server handles SIGINT only and as PID 1 ignores SIGTERM, so the image's STOPSIGNAL is what stops it (137 is a kill);
  #   * `migrate` runs in it (with no DATABASE_URL it refuses, and says so).
  # No layer cache yet (pass 5 measures it): every run builds the whole tree, on musl, in the Dockerfile's builder.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: thrust-server:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The first line of the Dockerfile, `# check=error=true`, makes BuildKit's own lint fail the build on a warning (a shell-form ENTRYPOINT, a secret in an ENV, an undefined variable).
      - name: Build the image
        run: |
          docker build --file docker/Dockerfile --tag "$IMAGE" .
          docker image ls "$IMAGE"

      - name: The image starts, answers, runs as 65532 and stops on SIGINT
        run: |
          set -eu
          cid="$(docker run --detach --publish 127.0.0.1:8080:8080 "$IMAGE")"
          trap 'status=$?; test "$status" = 0 || docker logs "$cid" || true; docker rm --force "$cid" > /dev/null 2>&1 || true' EXIT
          # curl waits for the port itself, so there is no loop here. Docker's userland proxy takes the connection before the server inside is listening and drops it, so what
          # the early attempts see is a reset or an empty reply, not a refusal: `--retry-connrefused` alone gave up on the first one (curl 56, seen when this was rehearsed).
          # An attempt that is retried still prints its error, so one `curl: (56)` line above a green step is the wait, not a failure.
          body="$(curl --silent --show-error --fail --max-time 5 --retry 20 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8080/healthz)"
          test "$body" = ok || { echo "::error::/healthz answered '$body', not 'ok'"; exit 1; }
          pid="$(docker inspect --format '{{.State.Pid}}' "$cid")"
          uids="$(awk '/^Uid:/ { print $2 "," $3 "," $4 "," $5 }' "/proc/$pid/status")"
          test "$uids" = 65532,65532,65532,65532 || { echo "::error::the server runs as uids $uids, not as 65532"; exit 1; }
          docker stop --time 5 "$cid" > /dev/null
          code="$(docker inspect --format '{{.State.ExitCode}}' "$cid")"
          test "$code" = 0 || { echo "::error::the server exited with $code after docker stop, not 0 (137 is a kill: nothing stopped it in five seconds)"; exit 1; }
          echo "answered, ran as 65532, stopped with exit $code"

      # `migrate` with no DATABASE_URL refuses and says so: that shows it is in the image and runs there (the binary is static, and the base has no libc to fall back on).
      - name: migrate runs in the image
        run: |
          out="$(docker run --rm --entrypoint /usr/local/bin/migrate "$IMAGE" 2>&1 || true)"
          echo "$out"
          case "$out" in
            *"DATABASE_URL must be set"*) ;;
            *) echo "::error::migrate did not run in the image: it should refuse for want of DATABASE_URL"; exit 1 ;;
          esac

  # PROOF OF CONCEPT (stage 6): the same build inside a real FreeBSD VM on the Linux runner, by two public actions, to compare them. Not the final shape.
  bsd-cpa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runner
        run: |
          ls -l /dev/kvm || true
          nproc
          free -m
      - uses: cross-platform-actions/action@30cde56b87a128507bebea9531205087890ee360 # v1.8.0
        with:
          operating_system: freebsd
          version: '14.5'
          architecture: x86-64
          cpu_count: 4
          shell: sh
          sync_files: runner-to-vm
          run: |
            set -eu
            t0="$(date +%s)"
            lap() { echo "LAP $1: $(( $(date +%s) - t0 )) s"; }
            uname -a
            freebsd-version
            sysctl -n hw.ncpu hw.physmem
            pwd
            pkg install -y curl
            lap pkg-curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            . "$HOME/.cargo/env"
            rustup toolchain install --profile minimal --no-self-update
            lap rustup
            rustc -vV
            test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-freebsd
            export CARGO_TARGET_DIR=/tmp/thrust-target
            cargo build --release --locked -p thrust-server
            lap server
            cargo build --release --locked -p thrust-adapters-postgres --features native --bin migrate
            lap migrate
            ls -l /tmp/thrust-target/release/thrust-server /tmp/thrust-target/release/migrate
            file /tmp/thrust-target/release/thrust-server

  bsd-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '14.5'
          cpu: 4
          copyback: false
          prepare: |
            pkg install -y curl
          run: |
            set -eu
            t0="$(date +%s)"
            lap() { echo "LAP $1: $(( $(date +%s) - t0 )) s"; }
            uname -a
            freebsd-version
            sysctl -n hw.ncpu hw.physmem
            pwd
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            . "$HOME/.cargo/env"
            rustup toolchain install --profile minimal --no-self-update
            lap rustup
            rustc -vV
            test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-freebsd
            export CARGO_TARGET_DIR=/tmp/thrust-target
            cargo build --release --locked -p thrust-server
            lap server
            cargo build --release --locked -p thrust-adapters-postgres --features native --bin migrate
            lap migrate
            ls -l /tmp/thrust-target/release/thrust-server /tmp/thrust-target/release/migrate
            file /tmp/thrust-target/release/thrust-server
