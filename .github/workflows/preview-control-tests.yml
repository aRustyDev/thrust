name: Preview control plane tests

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  preview-control:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          nextest: 'true'
          cache-key: preview-control-tests
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Test control-plane scripts and policy setup
        run: |
          bash infra/preview/scripts/test-bootstrap-provisioner.sh
          bash infra/preview/scripts/test-provisioner-client.sh
          bash infra/preview/scripts/test-reconcile-pr-previews.sh
          python3 infra/cloudflare/test-preview-access.py
      - name: Test the database security boundary
        run: bash infra/preview/scripts/test-provisioner-bootstrap.sh
      - name: Test and compile the provisioning Worker
        run: |
          scripts/rs cargo nextest run -p thrust-preview-provisioner --locked
          scripts/rs cargo check -p thrust-preview-provisioner --target wasm32-unknown-unknown --locked
