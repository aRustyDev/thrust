name: build

# What the repository builds, called by ci.yml (its `build` job) and runnable alone (ADR-0102). ci.yml passes `plan`, the jobs of this
# workflow that plan-ci.py says the change needs; a run by hand plans them all. The `verdict` job judges the jobs against that plan, so
# that a planned job that never ran turns ci.yml's `gate` red: a calling job is `success` when only some of its jobs ran.
#
# Each job is a COMPILE PROOF for one target (the owner, 2026-11-23: phases/0004-build.md): it builds what the repository ships, or may
# ship, and uploads the result as a workflow artifact with a short life. Nothing here is published, signed or attested, and no job has
# a secret, an environment or `id-token`: attestation and publishing are the release flow's (release.yml). The deploy bundle (the
# Workers, `migrate`, the web app) is NOT built here: deploy.yml and release.yml build it with the action build-bundle and attest it,
# and verify-bundle.sh requires those two files as its signers.

on:
  workflow_call:
    inputs:
      plan:
        description: JSON array of this workflow's jobs to run (the planner's `plans.build`)
        type: string
        required: true
    outputs:
      verdict:
        description: pass when every planned job succeeded and every other was skipped (ci.yml's gate requires it)
        value: ${{ jobs.verdict.outputs.verdict }}
  workflow_dispatch:
    inputs:
      plan:
        description: JSON array of the jobs to run
        type: string
        default: '["linux"]'

permissions: {}

jobs:
  # The native server and the migration binary, as a release build for x86_64-unknown-linux-gnu: the runner's own target. The profile is the
  # repository's [profile.release] (what an operator gets from `cargo build --release`, and what the contract suite's `bench` and `scale`
  # passes measure); nothing else builds `thrust-server` that way in CI, and the deploy bundle builds `migrate` only when a release is made.
  # Planned when thrust-server or thrust-adapters-postgres is affected (plan-ci.py). By hand: dispatch this workflow with the plan ["linux"].
  linux:
    if: contains(fromJSON(inputs.plan), 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build-linux
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Build thrust-server (release)
        run: scripts/rs cargo build --release --locked -p thrust-server
      # The same command build-bundle runs for the deploy bundle.
      - name: Build migrate (release)
        run: scripts/rs cargo build --release --locked -p thrust-adapters-postgres --features native --bin migrate
      # The control against a vacuous build: a build that exits 0 and makes no binary must not pass.
      - name: The build made both binaries
        run: |
          set -eu
          for bin in thrust-server migrate; do
            test -x "target/release/$bin" || { echo "::error::cargo built nothing at target/release/$bin"; exit 1; }
          done
          ls -l target/release/thrust-server target/release/migrate
      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux-x86_64-unknown-linux-gnu
          path: |
            target/release/thrust-server
            target/release/migrate
          if-no-files-found: error
          retention-days: 3

  # ADR-0102: judges this workflow's jobs against the plan, through the action every called workflow uses (it runs assert-gate.sh and
  # sets the output only after that passed). `always()`, so it reports when a job was skipped, failed or cancelled. ci.yml's `gate`
  # requires the output: a `verdict` job that was itself skipped leaves this workflow `success` and proves nothing. The checkout is
  # here and not in the action, which is read from it.
  verdict:
    needs: linux
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: judge
        uses: ./.github/actions/verdict
        with:
          needs: ${{ toJSON(needs) }}
          plan: ${{ inputs.plan }}
          jobs: linux
