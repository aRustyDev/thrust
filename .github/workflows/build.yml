name: build

# What the repository builds, called by ci.yml (its `build` job) and runnable alone (ADR-0102). ci.yml passes `plan`, the jobs of this
# workflow that plan-ci.py says the change needs; a run by hand plans them all. The `verdict` job judges the jobs against that plan, so
# that a planned job that never ran turns ci.yml's `gate` red: a calling job is `success` when only some of its jobs ran.
#
# Each job is a COMPILE PROOF for one target (the owner, 2026-11-23: phases/0004-build.md): it builds what the repository ships, or may
# ship, and uploads the result as a workflow artifact with a short life. Nothing here is published, signed or attested, and no job has
# a secret, an environment or `id-token`: attestation and publishing are the release flow's (release.yml). The deploy bundle (the
# Workers, `migrate`, the web app) is NOT built here: deploy.yml and release.yml build it with the action build-bundle and attest it,
# and verify-bundle.sh requires those two files as its signers.

on:
  workflow_call:
    inputs:
      plan:
        description: JSON array of this workflow's jobs to run (the planner's `plans.build`)
        type: string
        required: true
    outputs:
      verdict:
        description: pass when every planned job succeeded and every other was skipped (ci.yml's gate requires it)
        value: ${{ jobs.verdict.outputs.verdict }}
  workflow_dispatch:
    inputs:
      plan:
        description: JSON array of the jobs to run
        type: string
        default: '["linux","wasm","macos"]'

permissions: {}

jobs:
  # The native server and the migration binary, as a release build for x86_64-unknown-linux-gnu: the runner's own target. The profile is the
  # repository's [profile.release] (what an operator gets from `cargo build --release`, and what the contract suite's `bench` and `scale`
  # passes measure); nothing else builds `thrust-server` that way in CI, and the deploy bundle builds `migrate` only when a release is made.
  # Planned when thrust-server or thrust-adapters-postgres is affected (plan-ci.py). By hand: dispatch this workflow with the plan ["linux"].
  linux:
    if: contains(fromJSON(inputs.plan), 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The steps are the action's (build-native), which `macos` and the jobs for the targets that follow share: they were written here first, and were
      # an exact copy of what `macos` needs but for the runner, the cache key and the artifact's name, which are this job's inputs.
      - uses: ./.github/actions/build-native
        with:
          name: linux
          target: x86_64-unknown-linux-gnu

  # The two Workers the deploy bundle ships, built in release for wasm32-unknown-unknown with the bundle's own commands: the Worker as it ships
  # (`--no-default-features`) and the edge Worker on the shared hostname (ADR-0111). Nothing but build-bundle builds the edge Worker in release,
  # so a break that only its release build sees would reach a release candidate; that is the proof this job adds. The Worker as it ships is
  # built at pull-request time by the ten `worker-cf` cells too (wrangler.toml's build command is the bundle's), and with its default features by the
  # six `worker-memory` cells: the job builds it again, on purpose, so that the cache below holds what the bundle needs, and for the artifact.
  # Planned when thrust-worker or thrust-edge is affected (plan-ci.py). By hand: dispatch this workflow with the plan ["wasm"].
  #
  # THE CACHE KEY IS build-bundle's (`deploy-release`), on purpose. A cache is read by every ref but written by one: the bundle is built on an rc/*
  # branch or a tag, whose caches nothing else reads, and it never saved one. This job runs on pull requests and on `main`, and on `main` it saves
  # the key, so that the next bundle restores worker-build (compiled from source in 106 s on a cold runner, and a no-op when restored) and the
  # Workers' dependencies. The bundle's commands below are held equal to build-bundle's by the wiring test.
  wasm:
    if: contains(fromJSON(inputs.plan), 'wasm')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          worker-tools: "true"
          cache-key: deploy-release
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Worker (release, as it ships)
        working-directory: crates/worker
        run: ../../scripts/rs worker-build --release . --no-default-features
      - name: Build the edge Worker (release)
        working-directory: crates/edge
        run: ../../scripts/rs worker-build --release .
      # The control against a vacuous build: worker-build writes the whole of build/ (the shim imports ../index.js, which imports index_bg.wasm), and a
      # build that exits 0 and leaves one of the three out must not pass. The files build-bundle checks, for both Workers.
      - name: The builds made the Workers' files
        run: |
          set -eu
          for dir in crates/worker/build crates/edge/build; do
            for file in worker/shim.mjs index.js index_bg.wasm; do
              test -s "$dir/$file" || { echo "::error::worker-build wrote no $dir/$file"; exit 1; }
            done
          done
          ls -l crates/worker/build/index_bg.wasm crates/edge/build/index_bg.wasm
      - name: Upload the Workers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-wasm-wasm32-unknown-unknown
          path: |
            crates/worker/build
            crates/edge/build
          if-no-files-found: error
          retention-days: 3

  # The same two binaries as `linux`, for aarch64-apple-darwin: a hosted macOS runner (macos-15: three Apple M1 cores, 7 GB; standard runners are free
  # in a public repository). Nothing else in CI runs on macOS (the tests and the contract suite are run on a Mac by hand),
  # so a break that only this target sees (a crate that needs a Linux-only API, a C dependency that does not build with Apple's compiler) would be found
  # at a desk and not in a pull request. Planned with `linux` (plan-ci.py). By hand: dispatch this workflow with the plan ["macos"].
  macos:
    if: contains(fromJSON(inputs.plan), 'macos')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-native
        with:
          name: macos
          target: aarch64-apple-darwin

  # ADR-0102: judges this workflow's jobs against the plan, through the action every called workflow uses (it runs assert-gate.sh and
  # sets the output only after that passed). `always()`, so it reports when a job was skipped, failed or cancelled. ci.yml's `gate`
  # requires the output: a `verdict` job that was itself skipped leaves this workflow `success` and proves nothing. The checkout is
  # here and not in the action, which is read from it.
  verdict:
    needs: [linux, wasm, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: judge
        uses: ./.github/actions/verdict
        with:
          needs: ${{ toJSON(needs) }}
          plan: ${{ inputs.plan }}
          jobs: linux wasm macos
