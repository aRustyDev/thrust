# The release-candidate bot (.agents/plans/cicd-review/PLAN.md, PR 1). After every push to main it keeps one branch, rc/vX.Y.Z,
# equal to main plus a single commit `chore(release): vX.Y.Z` that writes CHANGELOG.md (git-cliff, cliff.toml) and the workspace
# version, and one pull request from that branch to main. Merging the pull request is the release.
#
# The logic is .github/scripts/release-pr.sh, tested by .github/scripts/tests/test-release-pr.sh in the `ci-scripts` job of ci.yml.
#
# Two jobs, so the credential is held only where it is used:
#   prepare   no secret. Decides whether there is anything to release, the version, and the three files.
#   publish   the release App's token. Makes the commit through the GitHub API (so GitHub signs it), moves the branch, opens or
#             updates the pull request, and removes rc/* branches of a version that was superseded.
#
# The App's token, not the workflow's own: a branch pushed with GITHUB_TOKEN starts no workflow, so neither ci nor (from PR 2 of the
# plan) the staging deploy would run on it. Until the repository variable RELEASE_APP_CLIENT_ID is set, `publish` is skipped and the
# workflow only reports, in the job summary, what it would do. Setting up the App: docs/src/architecture/cicd.md#release-candidates.
name: release-pr

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One run at a time and none cancelled: two quick merges must not interleave their force updates of the branch. The second run starts
# from the newer main and leaves the branch where it should be.
concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      action: ${{ steps.prepare.outputs.action }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      # Every commit and every tag: git-cliff reads the history since the last v* tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: git-cliff@2.14.2
      - name: Decide, and write the release files
        id: prepare
        env:
          MAIN_SHA: ${{ github.sha }}
          OUT_DIR: ${{ runner.temp }}/release
        run: |
          .github/scripts/release-pr.sh prepare > "$RUNNER_TEMP/prepare.out"
          cat "$RUNNER_TEMP/prepare.out" >> "$GITHUB_OUTPUT"
          {
            echo "### release-pr"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/prepare.out"
            if [ -f "$OUT_DIR/notes.md" ]; then echo; cat "$OUT_DIR/notes.md"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the release files for publish
        if: steps.prepare.outputs.action == 'release' || steps.prepare.outputs.action == 'current'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: prepare
    if: (needs.prepare.outputs.action == 'release' || needs.prepare.outputs.action == 'current') && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds the App's private key; restrict its deployment branches to main.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Mint the release App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Commit, move the branch, open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          OUT_DIR: ${{ runner.temp }}/release
        run: .github/scripts/release-pr.sh publish
