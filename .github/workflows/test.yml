name: test

# The repository's tests, called by ci.yml (its `test` job) and runnable alone (ADR-0102). ci.yml passes `plan`, the jobs of this workflow
# that plan-ci.py says the change needs (any of the four, or all); a run by hand plans them all. The `verdict` job judges the jobs against
# that plan, so that a planned job that never ran turns ci.yml's `gate` red: a calling job is `success` when only some of its jobs ran.
# The contract cells are still ci.yml's (the job `contract`, and `gate` judging their markers): they move in the next stage.

on:
  workflow_call:
    inputs:
      plan:
        description: JSON array of this workflow's jobs to run (the planner's `plans.test`)
        type: string
        required: true
    outputs:
      verdict:
        description: pass when every planned job succeeded and every other was skipped (ci.yml's gate requires it)
        value: ${{ jobs.verdict.outputs.verdict }}
  workflow_dispatch:
    inputs:
      plan:
        description: JSON array of the jobs to run
        type: string
        default: '["ci-scripts","hermetic","pg-adapter","mutants"]'

permissions: {}

jobs:
  # The logic behind the required check (gate, planner, certifier) is itself tested; a failing
  # helper test fails the gate through `needs`.
  ci-scripts:
    if: contains(fromJSON(inputs.plan), 'ci-scripts')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the helper scripts
        env:
          # test_plan_ci.py runs `cargo metadata`; the runner's stable reads the manifests as well as the pinned version would
          # (see the `changes` job), without installing it first.
          RUSTUP_TOOLCHAIN: stable
        run: |
          sh .github/scripts/tests/test-ci-scripts.sh
          sh .github/scripts/tests/test-toolchain-channel.sh
          sh .github/scripts/tests/test-required-contexts.sh
          sh .github/scripts/tests/test-check-web-diff.sh
          sh .github/scripts/tests/test-smoke-deploy.sh
          sh .github/scripts/tests/test-migrate-ci.sh
          sh .github/scripts/tests/test-check-migration-lint.sh
          sh .github/scripts/tests/test-deploy-template.sh
          sh .github/scripts/tests/test-deploy-ca.sh
          sh .github/scripts/tests/test-classify-deploy.sh
          sh .github/scripts/tests/test-plan-deploy.sh
          sh .github/scripts/tests/test-plan-release.sh
          sh .github/scripts/tests/test-assert-sha-checks.sh
          sh .github/scripts/tests/test-assert-gated-environments.sh
          sh .github/scripts/tests/test-lint-workflow.sh
          sh .github/scripts/tests/test-lint-all-workflows.sh
          sh .github/scripts/tests/test-check-ci-index.sh
          sh .github/scripts/tests/test-lint-actionlint.sh
          sh .github/scripts/tests/test-check-flake-hunt-cell.sh
          sh .github/scripts/tests/test-ports.sh
          sh .github/scripts/tests/test-mutants-verdict.sh
          sh .github/scripts/tests/test-samply-wrapper.sh
          sh .github/scripts/tests/test-deploy-worker.sh
          python3 -I .github/scripts/tests/test_active_version.py
          sh .github/scripts/tests/test-unpack-bundle.sh
          sh .github/scripts/tests/test-verify-bundle.sh
          sh .github/scripts/tests/test-fetch-release-bundle.sh
          sh .github/scripts/tests/test-fetch-previous-assets.sh
          sh .github/scripts/tests/test-check-asset-retention.sh
          python3 -I .github/scripts/tests/test_merge_assets.py
          python3 -I .github/scripts/tests/test_check_release_plz.py
          python3 -I .github/scripts/tests/test_flagship.py
          python3 -I .github/scripts/tests/test_preview_config.py
          python3 -I .github/scripts/tests/test_preview_result.py
          sh .github/scripts/tests/test-deploy-target.sh
          python3 -I .github/scripts/tests/test_plan_ci.py
          # ci.yml, the planner and each called workflow's file agree (ADR-0102): the calls, the gate's VERDICT_JOBS, the verdict jobs
          python3 -I .github/scripts/tests/test_workflow_wiring.py
          # The tests of the planner and the gate must be able to fail: each hand mutant of the planner, the gate, this file, the called
          # workflows and the verdict action is killed by them (ADR-0102).
          python3 -I .github/scripts/tests/mutate_gate.py

  # The hermetic loop: the default nextest profile (no Docker, Node, wrangler or running target) under the `ci`
  # profile, plus the doctests nextest cannot run. `oracle_` tests need the TypeScript oracle's generated output
  # and are excluded by the profile's default filter, not here. Every cargo command here, as in `lint`, `deny` and
  # `pg-adapter`, passes --locked: a Cargo.lock that Cargo would have to change fails the job instead of being rewritten
  # on the runner and tested in a form nobody committed.
  hermetic:
    if: contains(fromJSON(inputs.plan), 'hermetic')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-hermetic
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          nextest: 'true'
      # nextest exits 4 when the filter selects nothing, so an empty default profile fails this step.
      - name: Hermetic tests (nextest, ci profile)
        run: scripts/rs cargo nextest run --profile ci --workspace --locked
      # Every count in scripts/contract.sh and scripts/stage2-contract.sh against what its filters select in the suite (libtest's
      # `--list`, no server), then the control: stage2-contract.sh with a wrong count must be refused. The suite is built by the step
      # above, so this only lists it. It fails closed (exit 2) on an arm it cannot read or a filter that selects nothing.
      - name: Contract counts (every EXPECT against the suite)
        run: scripts/check-contract-counts.sh
      - name: Doctests
        run: scripts/rs cargo test --doc --workspace --locked
      # The tests of the OpenAPI document (issue #58) exist only with thrust-api-v1's `openapi` feature, which the run above does not
      # turn on: the document's operations against the router, its response schemas against real bodies, and its request schemas
      # against the parsers (`request_conformance`: bodies generated from the schemas' own keywords). nextest exits 4 if the filter
      # selects nothing, so a feature that stopped compiling them cannot pass. The default profile and not `ci`, which would write
      # `junit.xml` again and replace the report of the whole run that the next step uploads.
      - name: OpenAPI tests (nextest, openapi feature)
        run: scripts/rs cargo nextest run --no-fail-fast -p thrust-api-v1 --features openapi --locked -E 'binary(openapi) | binary(request_conformance)'
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-hermetic
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # The Postgres adapter tests start their own container through testcontainers (Docker on the runner).
  pg-adapter:
    if: contains(fromJSON(inputs.plan), 'pg-adapter')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-pg-adapter
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          nextest: 'true'
      # The `adapters` profile (.config/nextest.toml): a report, and no timeout kill, as on cargo test. nextest exits 4 if the
      # filterset selects nothing, so a renamed binary fails the step.
      - name: Postgres adapter tests (testcontainers)
        run: scripts/rs cargo nextest run -p thrust-adapters-selfhosted --profile adapters --locked -E 'binary(pg_adapter)'
      # The SMTP adapter against Mailpit (a mail server nobody here wrote), in the same Docker job: STARTTLS, implicit TLS, a login, the
      # server's own refusals, and the controls that make each of them able to fail. Its other suites are hermetic and run in `hermetic`.
      - name: SMTP adapter tests (Mailpit, testcontainers)
        run: scripts/rs cargo nextest run -p thrust-adapters-selfhosted --profile adapters --locked -E 'binary(smtp_sink)'

  # Mutation controls: every deliberately broken build must make the suite fail.
  mutants:
    if: contains(fromJSON(inputs.plan), 'mutants')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-mutants
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          nextest: 'true'   # scripts/contract.sh runs each mutant's pass on nextest
      - name: Every mutant must be KILLED
        run: scripts/mutants.sh

  # ADR-0102: judges this workflow's jobs against the plan, through the action every called workflow uses (it runs assert-gate.sh and
  # sets the output only after that passed). `always()`, so it reports when a job was skipped, failed or cancelled. ci.yml's `gate`
  # requires the output: a `verdict` job that was itself skipped leaves this workflow `success` and proves nothing. The checkout is
  # here and not in the action, which is read from it.
  verdict:
    needs: [ci-scripts, hermetic, pg-adapter, mutants]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: judge
        uses: ./.github/actions/verdict
        with:
          needs: ${{ toJSON(needs) }}
          plan: ${{ inputs.plan }}
          jobs: ci-scripts hermetic pg-adapter mutants
