name: ci

# One REQUIRED check: `gate`. Everything else is evidence the gate inspects.
# Triggers: pull_request and merge_group (a merge queue waits forever for a required check that its
# workflow does not run on), push to main, a nightly run of main, and manual runs. A pull request and a push to main run
# only the jobs and cells their change needs (.github/scripts/plan-ci.py). A release-candidate pull request (rc/*), a merge
# queue entry, the nightly run and a manual run run everything; a release candidate's green run is what starts the staging
# deploy (deploy.yml). The nightly run catches what no change brings: a new RustSec advisory, drift in the runner
# (ADR-0100). (A new Rust release does not reach the build by itself: rust-toolchain.toml pins the version, and Dependabot
# proposes the next one as a pull request.) deploy.yml ignores it (plan-deploy.sh deploys only after a pull request or a push).
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

# Supersede stale PR runs; never cancel main or merge-queue runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Affected-only: decide which jobs and which cells of the contract matrix the change needs (.github/scripts/plan-ci.py,
  # from the changed paths and Cargo's own dependency graph). This is a job, not a workflow-level `paths:` filter, because a
  # workflow skipped by a path filter never reports its check and a required check that never reports blocks the PR forever.
  # The cell list comes from scripts/contract-all.sh itself (plan-cells.sh); there is no second list to drift.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      jobs: ${{ steps.classify.outputs.jobs }}
      matrix: ${{ steps.classify.outputs.matrix }}
      cells: ${{ steps.classify.outputs.cells }}
      # what ci.yml's own gate expects (the jobs still here, then the called workflows with a planned job), and each called
      # workflow's planned jobs: its `plan` (ADR-0102)
      top: ${{ steps.classify.outputs.top }}
      plans: ${{ steps.classify.outputs.plans }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          # The runner's own stable, not the version rust-toolchain.toml pins: `cargo metadata --no-deps` reads manifests and
          # builds nothing, and without this rustup would first install the pinned toolchain here (and a failed install would
          # quietly turn every plan into "run everything").
          RUSTUP_TOOLCHAIN: stable
        run: |
          # The whole matrix, with its own guards (every `run` line parsed, none twice), into cells.txt.
          .github/scripts/plan-cells.sh > /dev/null
          full=""
          # A release candidate (this repository's rc/<name> pull request) runs everything: its `gate` is what lets deploy.yml put the
          # commit on staging, and release-plz builds it on whatever main was, whether or not main's own run passed. Its diff against
          # main (CHANGELOG.md, the version) says nothing about that.
          if [ "$EVENT" = pull_request ] && [ "$PR_HEAD_REPO" = "$REPO" ]; then
            case "$PR_HEAD_REF" in
              rc/*) full="release candidate $PR_HEAD_REF" ;;
            esac
          fi
          # A merge queue entry is the last check before main: it runs everything, whatever its diff.
          if [ "$EVENT" = merge_group ]; then
            full="a merge queue entry"
          fi
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$full" ]; then
            case "$base" in
              "" | 0000000000000000000000000000000000000000) full="no base to diff for '$EVENT'" ;;
            esac
          fi
          if [ -z "$full" ] && ! git diff --name-only "$base" "$HEAD_SHA" > changed.txt; then
            full="cannot diff $base..$HEAD_SHA"
          fi
          # Cargo's graph of the workspace's own crates (--no-deps: no registry, no download). The runner image has cargo.
          if [ -z "$full" ] && ! cargo metadata --format-version 1 --no-deps --offline > metadata.json; then
            full="cargo metadata failed"
          fi
          if [ -n "$full" ]; then
            echo "running everything: $full"
            python3 -I .github/scripts/plan-ci.py --full "$full" --cells cells.txt > plan.out
          else
            echo "changed files: $(wc -l < changed.txt | tr -d ' ')"
            python3 -I .github/scripts/plan-ci.py --changed changed.txt --metadata metadata.json --cells cells.txt > plan.out
          fi
          cat plan.out
          cat plan.out >> "$GITHUB_OUTPUT"
          {
            echo "jobs: $(sed -n 's/^jobs=//p' plan.out)"
            echo
            echo "cells: $(sed -n 's/^cells=//p' plan.out)"
          } >> "$GITHUB_STEP_SUMMARY"

  # The logic behind the required check (gate, planner, certifier) is itself tested; a failing
  # helper test fails the gate through `needs`.
  ci-scripts:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'ci-scripts')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the helper scripts
        env:
          # test_plan_ci.py runs `cargo metadata`; the runner's stable reads the manifests as well as the pinned version would
          # (see the `changes` job), without installing it first.
          RUSTUP_TOOLCHAIN: stable
        run: |
          sh .github/scripts/tests/test-ci-scripts.sh
          sh .github/scripts/tests/test-toolchain-channel.sh
          sh .github/scripts/tests/test-required-contexts.sh
          sh .github/scripts/tests/test-check-web-diff.sh
          sh .github/scripts/tests/test-smoke-deploy.sh
          sh .github/scripts/tests/test-migrate-ci.sh
          sh .github/scripts/tests/test-check-migration-lint.sh
          sh .github/scripts/tests/test-deploy-template.sh
          sh .github/scripts/tests/test-deploy-ca.sh
          sh .github/scripts/tests/test-classify-deploy.sh
          sh .github/scripts/tests/test-plan-deploy.sh
          sh .github/scripts/tests/test-plan-release.sh
          sh .github/scripts/tests/test-assert-sha-checks.sh
          sh .github/scripts/tests/test-assert-gated-environments.sh
          sh .github/scripts/tests/test-lint-workflow.sh
          sh .github/scripts/tests/test-lint-all-workflows.sh
          sh .github/scripts/tests/test-check-ci-index.sh
          sh .github/scripts/tests/test-lint-actionlint.sh
          sh .github/scripts/tests/test-check-flake-hunt-cell.sh
          sh .github/scripts/tests/test-ports.sh
          sh .github/scripts/tests/test-mutants-verdict.sh
          sh .github/scripts/tests/test-samply-wrapper.sh
          sh .github/scripts/tests/test-deploy-worker.sh
          python3 -I .github/scripts/tests/test_active_version.py
          sh .github/scripts/tests/test-unpack-bundle.sh
          sh .github/scripts/tests/test-verify-bundle.sh
          sh .github/scripts/tests/test-fetch-release-bundle.sh
          sh .github/scripts/tests/test-fetch-previous-assets.sh
          sh .github/scripts/tests/test-check-asset-retention.sh
          python3 -I .github/scripts/tests/test_merge_assets.py
          python3 -I .github/scripts/tests/test_check_release_plz.py
          python3 -I .github/scripts/tests/test_flagship.py
          python3 -I .github/scripts/tests/test_preview_config.py
          python3 -I .github/scripts/tests/test_preview_result.py
          sh .github/scripts/tests/test-deploy-target.sh
          python3 -I .github/scripts/tests/test_plan_ci.py
          # ci.yml, the planner and each called workflow's file agree (ADR-0102): the calls, the gate's VERDICT_JOBS, the verdict jobs
          python3 -I .github/scripts/tests/test_workflow_wiring.py
          # The tests of the planner and the gate must be able to fail: each hand mutant of the planner, the gate, this file, the called
          # workflows and the verdict action is killed by them (ADR-0102).
          python3 -I .github/scripts/tests/mutate_gate.py

  deps:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'deps')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release configuration guard compares the workspace with the last v* tag.
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: deps
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency-graph guard
        run: scripts/check-deps.sh
      # ADR-0009: every directory under crates/ is a crate or a group with a README.md that names it; nothing ships a crate from
      # testing/ or spikes/; core/ depends on nothing outside it; and the paths a move could silently break (workflow `paths:`
      # filters, mutants.toml's globs, .gitignore lines under crates/) still exist. The self-test is the control.
      - name: Crate layout guard
        run: |
          scripts/check-layout.sh
          scripts/check-layout.sh --self-test
      # One Worker, in Rust, with no Workflow and no service binding (ADR-0090, FR-05, FR-11, issue #43). The self-test is the
      # control: the guard is run on configs it must refuse, so a guard that stopped looking would fail here and not pass.
      - name: Topology guard (one Worker)
        run: |
          scripts/check-topology.sh
          scripts/check-topology.sh --self-test
      # ADR-0111 (issue #195): the edge Worker in front of production routes and binds nothing else (no data, assets, placement,
      # trigger or route; workers_dev and preview_urls off; one service binding, one Flagship binding). An allowlist, with its
      # self-test as the control.
      - name: Edge configuration guard (a routing Worker)
        run: |
          scripts/check-edge-config.sh
          scripts/check-edge-config.sh --self-test
      # Issue #51: every reproduced Plane 500 is answered by `thrust_plane_types::plane_500`, so neither Plane-shaped crate writes a
      # 500 of its own. The self-test is the control: the guard is run on trees it must refuse, and on empty ones it must not pass.
      - name: Plane 500 guard
        run: |
          scripts/check-plane-500.sh
          scripts/check-plane-500.sh --self-test
      # Issue #51: the compat replay's fixtures and the oracle recorder's steps are the rows of the F-X13 acceptance list (round 29),
      # which is generated from research/0003 and joined with the pinned route inventory: `comm -3` of each pair prints nothing. The
      # self-test is the control: lists with a missing, extra or pending row are refused, and an empty list is not a pass.
      - name: Acceptance-list guard
        run: |
          scripts/check-acceptance-list.sh
          scripts/check-acceptance-list.sh --self-test
      # Issue #39: the Worker's two real configs carry `[placement] region = "aws:us-east-1"`. A step and not a job, so
      # the gate's required contexts do not change.
      - name: Placement guard
        run: scripts/check-placement.sh
      # Issue #195: a migration numbered above 0017 may only add to the schema (no DROP, RENAME, column TYPE change or SET NOT NULL)
      # unless it is a contract migration (NNNN_contract_<what>.sql), which the deploy runs only in production and only when no older
      # version shares the data. Its test (ci-scripts) is the control: each construct is refused where it must be and nowhere else.
      - name: Migration expand-rule guard
        run: scripts/check-migration-lint.sh
      # The expected test counts of the contract suite's passes (scripts/contract.sh, scripts/stage2-contract.sh) go stale when a test
      # is added, and the stage2 ones were wrong for a day because nothing in CI runs that script. The check itself needs the suite
      # built, so it is a step of `hermetic`; this is its self-test, which runs it on worlds it must refuse (a count one too high, a
      # filter that selects nothing, a script it cannot read) and needs no compile. A step and not a job, as the guards above.
      - name: Contract count guard (self-test)
        run: scripts/check-contract-counts.sh --self-test
      # Issue #49: the deployed Worker's configuration is a template, and the renderer refuses whatever is not whole. Its self-test is the
      # control (a missing variable, an all-zero id, a thrust-spike name, an unknown marker are each refused), and it renders the real
      # template too, so the two cannot drift apart.
      - name: Deploy configuration guard
        run: scripts/render-wrangler.sh --self-test
      # The release flow: release-plz.toml must list every workspace member in one version group with one tag (release-plz has no
      # workspace-level group and does not check this itself), and a crate that is not in the last v* tag must have its
      # first-release pattern, or release-plz stops on main (it did after #211). The tags come from the checkout's fetch-tags.
      - name: Release configuration guard
        run: python3 -I .github/scripts/check-release-plz.py --first-release required
      # Issue #195: the Flagship policy every routing flag is made from. Its shape and names, no person (no `@`), and its
      # audiences exactly the edge's ACCESS_AUD_<AUDIENCE> variables. Offline: the live app is checked by flagship.yml.
      - name: Flagship policy guard
        run: python3 -I scripts/flagship.py validate
      # Every workflow and composite action, found by directory so a new one is linted the day it is added: pinned actions, explicit
      # permissions, no expression in a run, no pull_request_target, checkout without kept credentials, and secrets, environments and
      # id-token only in the jobs lint-all-workflows.sh names for that file (the deploy's two gated jobs, the release App's two jobs,
      # the two attesting `build` jobs). A workflow it does not name gets none of them.
      - name: Workflow guard (every workflow and action)
        run: .github/scripts/lint-all-workflows.sh
      # The indexes of the two directories, .github/workflows/README.md and .github/actions/README.md, have one row for every file they
      # index and none for a file that is gone: an index that lists a deleted workflow or omits a new one is a lie (ADR-0102, stage 0.4).
      - name: CI index guard (workflows and actions)
        run: sh .github/scripts/check-ci-index.sh
      # actionlint checks every workflow, and each call of a called workflow: the `with:` it passes against the callee's inputs, and the
      # outputs it reads through `needs`. It is installed from its own release, because taiki-e/install-action, which installs the other
      # tools here, does not offer it. lint-actionlint.sh runs it only inside this checkout, where it finds the project (in a plain
      # directory it checks nothing and says nothing), and first proves that it refuses a call that breaks the contract (research 0018, F11).
      - name: actionlint (every workflow), and the control that shows it is looking
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # The SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's own checksums file and from hashing the archive, which
          # the build attestation of rhysd/actionlint covers (`gh attestation verify`, with a control against another repository; 2026-11-16).
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          ACTIONLINT="$RUNNER_TEMP/actionlint" sh .github/scripts/lint-actionlint.sh
      # Issue #58 (ADR-0032): the OpenAPI document that `thrust-api-v1` writes from the types its routes answer with, diffed against
      # the pinned Plane schema with oasdiff (a pinned image; Docker is on the runner). Every difference must be a recorded one and
      # every recorded one must still be there; the check breaks the document three ways and the register one way, and each must be
      # refused. A step and not a job, so the gate's required contexts do not change.
      - name: OpenAPI schema diff (oasdiff)
        run: |
          scripts/check-openapi.sh --self-test
          scripts/check-openapi.sh

  # rustfmt and clippy (issue #40). Clippy runs with `-D warnings`, so the four lints `Cargo.toml` denies in core, ports and the
  # adapters (ADR-0006's panic policy: unwrap, expect, panic, indexing) and every other warning fail it. The second clippy run is
  # the Worker as it ships: wasm32, no default features, so the `memory` adapter set is out of it. The clippy steps run even when
  # rustfmt failed, so one push reports everything.
  lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'lint')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
          cache-key: lint
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        run: scripts/rs cargo fmt --all --check
      - name: clippy (native, every target)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (the Worker, wasm32)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy -p thrust-worker --no-default-features --target wasm32-unknown-unknown --locked -- -D warnings
      # The edge (ADR-0111) as it ships: its runtime module exists only in the wasm32 build, so the native run above never sees it.
      - name: clippy (the edge, wasm32)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy -p thrust-edge --target wasm32-unknown-unknown --locked -- -D warnings
      # The `openapi` feature of thrust-api-v1 (issue #58) is off in every run above, so the derives and path declarations behind it
      # are linted here, under the same four denied lints.
      - name: clippy (thrust-api-v1 with the OpenAPI feature)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy -p thrust-api-v1 --features openapi --all-targets --locked -- -D warnings

  # The hermetic loop: the default nextest profile (no Docker, Node, wrangler or running target) under the `ci`
  # profile, plus the doctests nextest cannot run. `oracle_` tests need the TypeScript oracle's generated output
  # and are excluded by the profile's default filter, not here. Every cargo command here, as in `lint`, `deny` and
  # `pg-adapter`, passes --locked: a Cargo.lock that Cargo would have to change fails the job instead of being rewritten
  # on the runner and tested in a form nobody committed.
  hermetic:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'hermetic')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-hermetic
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          nextest: 'true'
      # nextest exits 4 when the filter selects nothing, so an empty default profile fails this step.
      - name: Hermetic tests (nextest, ci profile)
        run: scripts/rs cargo nextest run --profile ci --workspace --locked
      # Every count in scripts/contract.sh and scripts/stage2-contract.sh against what its filters select in the suite (libtest's
      # `--list`, no server), then the control: stage2-contract.sh with a wrong count must be refused. The suite is built by the step
      # above, so this only lists it. It fails closed (exit 2) on an arm it cannot read or a filter that selects nothing.
      - name: Contract counts (every EXPECT against the suite)
        run: scripts/check-contract-counts.sh
      - name: Doctests
        run: scripts/rs cargo test --doc --workspace --locked
      # The tests of the OpenAPI document (issue #58) exist only with thrust-api-v1's `openapi` feature, which the run above does not
      # turn on: the document's operations against the router, its response schemas against real bodies, and its request schemas
      # against the parsers (`request_conformance`: bodies generated from the schemas' own keywords). nextest exits 4 if the filter
      # selects nothing, so a feature that stopped compiling them cannot pass. The default profile and not `ci`, which would write
      # `junit.xml` again and replace the report of the whole run that the next step uploads.
      - name: OpenAPI tests (nextest, openapi feature)
        run: scripts/rs cargo nextest run --no-fail-fast -p thrust-api-v1 --features openapi --locked -E 'binary(openapi) | binary(request_conformance)'
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-hermetic
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # The Postgres adapter tests start their own container through testcontainers (Docker on the runner).
  pg-adapter:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'pg-adapter')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-pg-adapter
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          nextest: 'true'
      # The `adapters` profile (.config/nextest.toml): a report, and no timeout kill, as on cargo test. nextest exits 4 if the
      # filterset selects nothing, so a renamed binary fails the step.
      - name: Postgres adapter tests (testcontainers)
        run: scripts/rs cargo nextest run -p thrust-adapters-selfhosted --profile adapters --locked -E 'binary(pg_adapter)'
      # The SMTP adapter against Mailpit (a mail server nobody here wrote), in the same Docker job: STARTTLS, implicit TLS, a login, the
      # server's own refusals, and the controls that make each of them able to fail. Its other suites are hermetic and run in `hermetic`.
      - name: SMTP adapter tests (Mailpit, testcontainers)
        run: scripts/rs cargo nextest run -p thrust-adapters-selfhosted --profile adapters --locked -E 'binary(smtp_sink)'

  # One job per cell, each on a fresh runner with its own checkout, so the shared-build-directory
  # hazard that forces contract-all.sh to run serially on one machine does not apply here.
  # Only the cells the change needs (plan-ci.py): a target runs when the binary it serves is affected, a pass when its own
  # inputs changed (tools/oracle-v1/ the oracle cells, e2e/ and web/ the browser journeys).
  contract:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'contract')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/contract-cell.yml
    with:
      target: ${{ matrix.target }}
      pass: ${{ matrix.pass }}
    permissions:
      contents: read

  # Mutation controls: every deliberately broken build must make the suite fail.
  mutants:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'mutants')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-mutants
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          nextest: 'true'   # scripts/contract.sh runs each mutant's pass on nextest
      - name: Every mutant must be KILLED
        run: scripts/mutants.sh

  # The stock React app (web/): web.yml, called here and judged by its own `verdict` job (ADR-0102), like the book's and the supply
  # chain's. `top` says whether the change needs it, and `plans` gives it the jobs to run. The `web` job is that workflow's; the call
  # keeps the id `web`, so that `gate` waits for it under the name it always had.
  web:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.top || '[]'), 'web')
    uses: ./.github/workflows/web.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.changes.outputs.plans || '{}').web) }}
    permissions:
      contents: read

  # The book (docs/, mdBook): documentation.yml, called here and judged by its own `verdict` job (ADR-0102). `top` says whether the
  # change needs it, and `plans` gives it the jobs to run. The `docs` job is that workflow's.
  documentation:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.top || '[]'), 'documentation')
    uses: ./.github/workflows/documentation.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.changes.outputs.plans || '{}').documentation) }}
    permissions:
      contents: read

  # The supply-chain check (cargo-deny): security.yml, called here and judged by its own `verdict` job (ADR-0102), like the book's.
  # The `deny` job is that workflow's.
  security:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.top || '[]'), 'security')
    uses: ./.github/workflows/security.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.changes.outputs.plans || '{}').security) }}
    permissions:
      contents: read

  gate:
    name: gate
    if: always()
    needs: [changes, ci-scripts, deps, lint, hermetic, pg-adapter, contract, mutants, web, documentation, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the per-cell pass markers
        if: contains(fromJSON(needs.changes.outputs.jobs || '[]'), 'contract')
        # If every cell failed there is nothing to download; the assert step below then fails on
        # "no cell markers", so tolerating the download error here cannot produce a green gate.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cell-ok-*
          path: reported
          merge-multiple: true
      - name: Assert the planned set ran and passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # the jobs still here and the called workflows that have a planned job (the planner's `top`), not every planned job: a
          # called workflow's own jobs are judged by its `verdict` job
          EXPECTED_JOBS: ${{ needs.changes.outputs.top }}
          # the called workflows. A STATIC list, not the planner's `workflows` output: a planner bug that left one out of that output
          # would switch off the check for it. test_plan_ci.py holds this list equal to the keys of the planner's WORKFLOWS.
          VERDICT_JOBS: documentation security web
          PLANNED: ${{ needs.changes.outputs.cells || '[]' }}
          REPORTED_DIR: reported
        run: .github/scripts/assert-gate.sh
