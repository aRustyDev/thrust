name: ci

# One REQUIRED check: `gate`. Everything else is evidence the gate inspects.
# Triggers: pull_request and merge_group (a merge queue waits forever for a required check that its
# workflow does not run on), push to main, and manual runs.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Supersede stale PR runs; never cancel main or merge-queue runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Affected-only: decide whether anything the Rust jobs depend on changed. This is a job, not a
  # workflow-level `paths:` filter, because a workflow skipped by a path filter never reports its
  # check and a required check that never reports blocks the PR forever.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MG_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          case "$base" in
            "" | 0000000000000000000000000000000000000000)
              echo "rust=true" >> "$GITHUB_OUTPUT"
              echo "web=true" >> "$GITHUB_OUTPUT"
              echo "no usable base for '$EVENT'; failing open (run everything)"
              exit 0
              ;;
          esac
          if ! git diff --name-only "$base" "$HEAD_SHA" > changed.txt; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "cannot diff $base..$HEAD_SHA; failing open (run everything)"
            exit 0
          fi
          echo "changed files: $(wc -l < changed.txt | tr -d ' ')"
          .github/scripts/classify-changes.sh < changed.txt >> "$GITHUB_OUTPUT"

  # The cell list comes from scripts/contract-all.sh itself; there is no second list to drift.
  plan:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      cells: ${{ steps.plan.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: .github/scripts/plan-cells.sh >> "$GITHUB_OUTPUT"

  # The logic behind the required check (gate, plan, classifier, certifier) is itself tested; a failing
  # helper test fails the gate through `needs`.
  ci-scripts:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the helper scripts
        run: |
          sh .github/scripts/tests/test-ci-scripts.sh
          sh .github/scripts/tests/test-required-contexts.sh
          sh .github/scripts/tests/test-check-web-diff.sh
          sh .github/scripts/tests/test-smoke-deploy.sh
          sh .github/scripts/tests/test-migrate-ci.sh
          sh .github/scripts/tests/test-deploy-template.sh
          sh .github/scripts/tests/test-deploy-ca.sh
          sh .github/scripts/tests/test-classify-deploy.sh
          sh .github/scripts/tests/test-plan-deploy.sh
          sh .github/scripts/tests/test-assert-sha-checks.sh
          sh .github/scripts/tests/test-assert-gated-environments.sh
          sh .github/scripts/tests/test-lint-workflow.sh
          sh .github/scripts/tests/test-deploy-worker.sh
          python3 -I .github/scripts/tests/test_active_version.py
          sh .github/scripts/tests/test-unpack-bundle.sh
          sh .github/scripts/tests/test-verify-bundle.sh
          sh .github/scripts/tests/test-fetch-previous-assets.sh
          sh .github/scripts/tests/test-check-asset-retention.sh
          python3 -I .github/scripts/tests/test_merge_assets.py

  deps:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: deps
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency-graph guard
        run: scripts/check-deps.sh
      # One Worker, in Rust, with no Workflow and no service binding (ADR-0090, FR-05, FR-11, issue #43). The self-test is the
      # control: the guard is run on configs it must refuse, so a guard that stopped looking would fail here and not pass.
      - name: Topology guard (one Worker)
        run: |
          scripts/check-topology.sh
          scripts/check-topology.sh --self-test
      # Issue #51: every reproduced Plane 500 is answered by `thrust_plane_types::plane_500`, so neither Plane-shaped crate writes a
      # 500 of its own. The self-test is the control: the guard is run on trees it must refuse, and on empty ones it must not pass.
      - name: Plane 500 guard
        run: |
          scripts/check-plane-500.sh
          scripts/check-plane-500.sh --self-test
      # Issue #51: the compat replay's fixtures and the oracle recorder's steps are the rows of the F-X13 acceptance list (round 29),
      # which is generated from research/0003 and joined with the pinned route inventory: `comm -3` of each pair prints nothing. The
      # self-test is the control: lists with a missing, extra or pending row are refused, and an empty list is not a pass.
      - name: Acceptance-list guard
        run: |
          scripts/check-acceptance-list.sh
          scripts/check-acceptance-list.sh --self-test
      # Issue #39: the Worker's two real configs carry `[placement] region = "aws:us-east-1"`. A step and not a job, so
      # the gate's required contexts do not change.
      - name: Placement guard
        run: scripts/check-placement.sh
      # Issue #49: the deployed Worker's configuration is a template, and the renderer refuses whatever is not whole. Its self-test is the
      # control (a missing variable, an all-zero id, a thrust-spike name, an unknown marker are each refused), and it renders the real
      # template too, so the two cannot drift apart. The workflow lint holds the deploy workflow to the rules of a workflow that has
      # credentials: pinned actions, explicit permissions, no expression in a run, secrets only in the two gated jobs.
      - name: Deploy configuration and workflow guards
        run: |
          scripts/render-wrangler.sh --self-test
          .github/scripts/lint-workflow.sh .github/workflows/deploy.yml .github/actions/deploy-worker/action.yml

  # rustfmt and clippy (issue #40). Clippy runs with `-D warnings`, so the four lints `Cargo.toml` denies in core, ports and the
  # adapters (ADR-0006's panic policy: unwrap, expect, panic, indexing) and every other warning fail it. The second clippy run is
  # the Worker as it ships: wasm32, no default features, so the `memory` adapter set is out of it. The clippy steps run even when
  # rustfmt failed, so one push reports everything.
  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
          cache-key: lint
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        run: scripts/rs cargo fmt --all --check
      - name: clippy (native, every target)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (the Worker, wasm32)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy -p thrust-worker --no-default-features --target wasm32-unknown-unknown --locked -- -D warnings

  # cargo-deny (issue #40; ADR-0100 and ADR-0101 require a Rust supply-chain gate), configured by `deny.toml`: advisories (RustSec),
  # licences, bans (sqlx, sea-orm, diesel: ADR-0044) and sources (crates.io only). It fetches the advisory database on every run, so
  # a new advisory can turn it red with no change to the code: fix it by upgrading, and read the note above the one ignore in
  # `deny.toml` before adding another.
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: deny
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: scripts/rs cargo deny --locked check

  # The hermetic loop: the default nextest profile (no Docker, Node, wrangler or running target) under the `ci`
  # profile, plus the doctests nextest cannot run. `oracle_` tests need the TypeScript oracle's generated output
  # and are excluded by the profile's default filter, not here.
  hermetic:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-hermetic
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.140
      # nextest exits 4 when the filter selects nothing, so an empty default profile fails this step.
      - name: Hermetic tests (nextest, ci profile)
        run: scripts/rs cargo nextest run --profile ci --workspace
      - name: Doctests
        run: scripts/rs cargo test --doc --workspace
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-hermetic
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # The Postgres adapter tests start their own container through testcontainers (Docker on the runner).
  pg-adapter:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-pg-adapter
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Postgres adapter tests (testcontainers)
        run: scripts/rs cargo test -p thrust-adapters-selfhosted --test pg_adapter

  # One job per cell, each on a fresh runner with its own checkout, so the shared-build-directory
  # hazard that forces contract-all.sh to run serially on one machine does not apply here.
  contract:
    needs: [changes, plan]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/contract-cell.yml
    with:
      target: ${{ matrix.target }}
      pass: ${{ matrix.pass }}
    permissions:
      contents: read

  # Mutation controls: every deliberately broken build must make the suite fail.
  mutants:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-mutants
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Every mutant must be KILLED
        run: scripts/mutants.sh

  # The stock React app (web/, issue #44, web/SOURCE). Runs when web/ or the CI files change (classify-changes.sh), not on
  # `rust`. The Q-R2 gate first: only the files in web/ALLOWED-CHANGES may differ from the oracle pin. Then the install and the
  # build, so an import or an edit that no longer builds fails here and not later. pnpm is the version web/package.json pins,
  # read from it, so there is no second copy to drift; Node is web/.node-version. Dependency scripts are off (--ignore-scripts):
  # 1,158 packages is no place to run arbitrary install hooks, and the build does not need them.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Q-R2 gate (only the allowed files differ from the pin)
        run: scripts/check-web-diff.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - name: pnpm, at the version web/package.json pins
        run: |
          want="$(node -p "require('./web/package.json').packageManager.split('@')[1].split('+')[0]")"
          npm install --global "pnpm@$want"
          test "$(pnpm --dir web --version)" = "$want"
      - name: Install (frozen lockfile, no dependency scripts)
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Build the app and the packages it needs
        run: pnpm --dir web exec turbo run build --filter=web
      # The control against a vacuous build: a build that exits 0 and makes no SPA must not pass.
      - name: The build made the SPA
        run: test -s web/apps/web/build/client/index.html

  gate:
    name: gate
    if: always()
    needs: [changes, plan, ci-scripts, deps, lint, deny, hermetic, pg-adapter, contract, mutants, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the per-cell pass markers
        if: needs.changes.outputs.rust == 'true'
        # If every cell failed there is nothing to download; the assert step below then fails on
        # "no cell markers", so tolerating the download error here cannot produce a green gate.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cell-ok-*
          path: reported
          merge-multiple: true
      - name: Assert the planned set ran and passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          PLANNED: ${{ needs.plan.outputs.cells || '[]' }}
          REPORTED_DIR: reported
        run: .github/scripts/assert-gate.sh
