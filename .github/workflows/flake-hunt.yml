name: flake-hunt

# Re-run one contract cell N times to characterise flakiness (scripts/flake-hunt.sh).
# Manual (workflow_dispatch inputs) or weekly (schedule: UTC, default branch only; GitHub disables
# scheduled workflows in a public repository after 60 days without repository activity).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Contract target
        type: choice
        options:
          - native-memory
          - native-pg
          - worker-memory
          - worker-cf
        default: native-memory
      # Every pass of the contract matrix (scripts/contract-all.sh), and only those: test-check-flake-hunt-cell.sh holds both lists to it.
      # Not every pairing is a cell; the first step refuses one the matrix does not run, and names the passes the target does.
      pass:
        description: Pass to repeat (the target and pass must be a cell of scripts/contract-all.sh)
        type: choice
        options:
          - main
          - sweeper
          - panic
          - csrfoff
          - mail
          - oracle
          - cron
          - worker
          - bindings
          - e2e
          - e2e-mail
        default: main
      iterations:
        description: Repetitions, 1 to 50
        type: number
        default: 5
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: flake-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # `inputs` is empty on a scheduled run, so every value has a default
      TARGET: ${{ inputs.target || 'native-memory' }}
      PASS: ${{ inputs.pass || 'main' }}
      ITER: ${{ inputs.iterations || 5 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before any build: the target and pass must be a cell of the matrix, and the iterations 1 to 50.
      - name: Validate inputs
        run: .github/scripts/check-flake-hunt-cell.sh "$TARGET" "$PASS" $ITER

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ startsWith(inputs.target, 'worker') && 'wasm32-unknown-unknown' || '' }}
          worker-tools: ${{ startsWith(inputs.target, 'worker') && 'true' || 'false' }}
          # Restore-only (save-cache is left at its default): reuses what the main-branch contract cells saved.
          cache-key: contract-${{ startsWith(inputs.target, 'worker') && 'wasm' || 'native' }}
          nextest: 'true'   # scripts/contract.sh runs the pass on nextest

      # What the pass needs beyond Rust (uv for oracle; Node, the built app and Chromium for e2e), built once for every iteration,
      # and the preflight of its host tools: the same action a contract cell uses.
      - uses: ./.github/actions/contract-pass-tools
        with:
          target: ${{ env.TARGET }}
          pass: ${{ env.PASS }}

      # scripts/flake-hunt.sh ends with `echo "failures: X / N"`, so its exit status is ALWAYS 0.
      # The verdict is that last line: assert it exists and says zero failures out of N.
      - name: Hunt
        run: |
          status=0
          scripts/flake-hunt.sh "$TARGET" "$PASS" "$ITER" > flake.log 2>&1 || status=$?
          cat flake.log
          if [ "$status" -ne 0 ]; then
            echo "::error::flake-hunt.sh exited $status"
            exit 1
          fi
          if ! grep -qx "failures: 0 / ${ITER}" flake.log; then
            echo "::error::flake-hunt did not report 'failures: 0 / ${ITER}'"
            exit 1
          fi

      - name: Upload every iteration's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-hunt-${{ env.TARGET }}-${{ env.PASS }}
          path: target/flake-hunt/
          if-no-files-found: ignore
          retention-days: 7
