name: lint

# The repository's guards, the Rust lint, the shell lint, the YAML lint and the JSON lint, called by ci.yml (its `lint` job) and runnable alone (ADR-0102). ci.yml passes
# `plan`, the jobs of this workflow that plan-ci.py says the change needs (`deps`, `lint`, `bash`, `yaml`, `json`: any of them); a run by hand plans all. The `verdict` job judges
# the jobs against that plan, so that a planned job that never ran turns ci.yml's `gate` red: a calling job is `success` when only some of
# its jobs ran.

on:
  workflow_call:
    inputs:
      plan:
        description: JSON array of this workflow's jobs to run (the planner's `plans.lint`)
        type: string
        required: true
    outputs:
      verdict:
        description: pass when every planned job succeeded and every other was skipped (ci.yml's gate requires it)
        value: ${{ jobs.verdict.outputs.verdict }}
  workflow_dispatch:
    inputs:
      plan:
        description: JSON array of the jobs to run
        type: string
        default: '["deps","lint","bash","yaml","json"]'

permissions: {}

jobs:
  deps:
    if: contains(fromJSON(inputs.plan), 'deps')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release configuration guard compares the workspace with the last v* tag.
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: deps
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency-graph guard
        run: scripts/check-deps.sh
      # ADR-0009: every directory under crates/ is a crate or a group with a README.md that names it; nothing ships a crate from
      # testing/ or spikes/; core/ depends on nothing outside it; and the paths a move could silently break (workflow `paths:`
      # filters, mutants.toml's globs, .gitignore lines under crates/) still exist. The self-test is the control.
      - name: Crate layout guard
        run: |
          scripts/check-layout.sh
          scripts/check-layout.sh --self-test
      # One Worker, in Rust, with no Workflow and no service binding (ADR-0090, FR-05, FR-11, issue #43). The self-test is the
      # control: the guard is run on configs it must refuse, so a guard that stopped looking would fail here and not pass.
      - name: Topology guard (one Worker)
        run: |
          scripts/check-topology.sh
          scripts/check-topology.sh --self-test
      # ADR-0111 (issue #195): the edge Worker in front of production routes and binds nothing else (no data, assets, placement,
      # trigger or route; workers_dev and preview_urls off; one service binding, one Flagship binding). An allowlist, with its
      # self-test as the control.
      - name: Edge configuration guard (a routing Worker)
        run: |
          scripts/check-edge-config.sh
          scripts/check-edge-config.sh --self-test
      # Issue #51: every reproduced Plane 500 is answered by `thrust_plane_types::plane_500`, so neither Plane-shaped crate writes a
      # 500 of its own. The self-test is the control: the guard is run on trees it must refuse, and on empty ones it must not pass.
      - name: Plane 500 guard
        run: |
          scripts/check-plane-500.sh
          scripts/check-plane-500.sh --self-test
      # Issue #51: the compat replay's fixtures and the oracle recorder's steps are the rows of the F-X13 acceptance list (round 29),
      # which is generated from research/0003 and joined with the pinned route inventory: `comm -3` of each pair prints nothing. The
      # self-test is the control: lists with a missing, extra or pending row are refused, and an empty list is not a pass.
      - name: Acceptance-list guard
        run: |
          scripts/check-acceptance-list.sh
          scripts/check-acceptance-list.sh --self-test
      # Issue #39: the Worker's two real configs carry `[placement] region = "aws:us-east-1"`. A step and not a job, so
      # the gate's required contexts do not change.
      - name: Placement guard
        run: scripts/check-placement.sh
      # Issue #195: a migration numbered above 0017 may only add to the schema (no DROP, RENAME, column TYPE change or SET NOT NULL)
      # unless it is a contract migration (NNNN_contract_<what>.sql), which the deploy runs only in production and only when no older
      # version shares the data. Its test (ci-scripts) is the control: each construct is refused where it must be and nowhere else.
      - name: Migration expand-rule guard
        run: scripts/check-migration-lint.sh
      # Cargo.lock is what cargo writes (#279, #284): `cargo metadata --locked`, which every other step uses, accepts a lockfile whose
      # packages are in the wrong order, and a cargo command without it then rewrites the file, so a clean checkout is dirty after its
      # first cargo run. The check runs cargo without `--locked` and fails when it changes the file (and puts the file back either way).
      # Its self-test is the control: two packages swapped, a member the lockfile has not heard of, no lockfile and a cargo that fails.
      # Steps and not a job, as the guards around them.
      - name: Cargo.lock guard (self-test)
        run: scripts/check-cargo-lock.sh --self-test
      - name: Cargo.lock guard
        run: scripts/check-cargo-lock.sh
      # The expected test counts of the contract suite's passes (scripts/contract.sh, scripts/stage2-contract.sh) go stale when a test
      # is added, and the stage2 ones were wrong for a day because nothing in CI runs that script. The check itself needs the suite
      # built, so it is a step of `hermetic`; this is its self-test, which runs it on worlds it must refuse (a count one too high, a
      # filter that selects nothing, a script it cannot read) and needs no compile. A step and not a job, as the guards above.
      - name: Contract count guard (self-test)
        run: scripts/check-contract-counts.sh --self-test
      # Issue #49: the deployed Worker's configuration is a template, and the renderer refuses whatever is not whole. Its self-test is the
      # control (a missing variable, an all-zero id, a thrust-spike name, an unknown marker are each refused), and it renders the real
      # template too, so the two cannot drift apart.
      - name: Deploy configuration guard
        run: scripts/render-wrangler.sh --self-test
      # The release flow: release-plz.toml must list every workspace member in one version group with one tag (release-plz has no
      # workspace-level group and does not check this itself), and a crate that is not in the last v* tag must have its
      # first-release pattern, or release-plz stops on main (it did after #211). The tags come from the checkout's fetch-tags.
      - name: Release configuration guard
        run: python3 -I .github/scripts/check-release-plz.py --first-release required
      # Issue #195: the Flagship policy every routing flag is made from. Its shape and names, no person (no `@`), and its
      # audiences exactly the edge's ACCESS_AUD_<AUDIENCE> variables. Offline: the live app is checked by flagship.yml.
      - name: Flagship policy guard
        run: python3 -I scripts/flagship.py validate
      # Every workflow and composite action, found by directory so a new one is linted the day it is added: pinned actions, explicit
      # permissions, no expression in a run, no pull_request_target, checkout without kept credentials, and secrets, environments and
      # id-token only in the jobs lint-all-workflows.sh names for that file (the deploy's two gated jobs, the release App's two jobs,
      # the two attesting `build` jobs). A workflow it does not name gets none of them.
      - name: Workflow guard (every workflow and action)
        run: .github/scripts/lint-all-workflows.sh
      # The indexes of the two directories, .github/workflows/README.md and .github/actions/README.md, have one row for every file they
      # index and none for a file that is gone: an index that lists a deleted workflow or omits a new one is a lie (ADR-0102, stage 0.4).
      - name: CI index guard (workflows and actions)
        run: sh .github/scripts/check-ci-index.sh
      # The shellcheck that actionlint runs over every `run:` block of every workflow, at the version the `bash` job and check-shell.sh hold the
      # repository's scripts to (test_workflow_wiring.py holds the three equal). Without this step actionlint takes the image's, 0.9.0, which does
      # not know SC2329 and the codes after it: a workflow's shell was read by an older shellcheck than the scripts' (Lint phase, stage 1, probe C).
      # The step before the actionlint one, because lint-actionlint.sh hands actionlint the shellcheck on PATH and refuses a run that has none.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck@0.11.0
      # actionlint checks every workflow, and each call of a called workflow: the `with:` it passes against the callee's inputs, and the
      # outputs it reads through `needs`, and the shell of each `run:` block, with the shellcheck above. It is installed from its own release,
      # because taiki-e/install-action, which installs the other tools here, does not offer it. lint-actionlint.sh runs it only inside this
      # checkout, where it finds the project (in a plain directory it checks nothing and says nothing), and first proves that it refuses a call
      # that breaks the contract, an unquoted variable and a function never called, which only the pinned shellcheck says (research 0018, F11).
      - name: actionlint (every workflow), and the control that shows it is looking
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # The SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's own checksums file and from hashing the archive, which
          # the build attestation of rhysd/actionlint covers (`gh attestation verify`, with a control against another repository; 2026-11-16).
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          ACTIONLINT="$RUNNER_TEMP/actionlint" sh .github/scripts/lint-actionlint.sh
      # Issue #58 (ADR-0032): the OpenAPI document that `thrust-api-v1` writes from the types its routes answer with, diffed against
      # the pinned Plane schema with oasdiff (a pinned image; Docker is on the runner). Every difference must be a recorded one and
      # every recorded one must still be there; the check breaks the document three ways and the register one way, and each must be
      # refused. A step and not a job, so the gate's required contexts do not change.
      - name: OpenAPI schema diff (oasdiff)
        run: |
          scripts/check-openapi.sh --self-test
          scripts/check-openapi.sh

  # rustfmt and clippy (issue #40). Clippy runs with `-D warnings`, so the four lints `Cargo.toml` denies in core, ports and the
  # adapters (ADR-0006's panic policy: unwrap, expect, panic, indexing) and every other warning fail it. The second clippy run is
  # the Worker as it ships: wasm32, no default features, so the `memory` adapter set is out of it. The clippy steps run even when
  # rustfmt failed, so one push reports everything.
  lint:
    if: contains(fromJSON(inputs.plan), 'lint')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
          cache-key: lint
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        run: scripts/rs cargo fmt --all --check
      - name: clippy (native, every target)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (the Worker, wasm32)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy -p thrust-worker --no-default-features --target wasm32-unknown-unknown --locked -- -D warnings
      # The edge (ADR-0111) as it ships: its runtime module exists only in the wasm32 build, so the native run above never sees it.
      - name: clippy (the edge, wasm32)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy -p thrust-edge --target wasm32-unknown-unknown --locked -- -D warnings
      # Its runtime is compiled only for wasm32; the native workspace checks cannot see it.
      - name: Check preview provisioner (wasm32)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo check -p thrust-preview-provisioner --target wasm32-unknown-unknown --locked
      - name: clippy (preview migration executor, wasm32)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy -p thrust-preview-migration-executor --target wasm32-unknown-unknown --locked -- -D warnings
      # The `openapi` feature of thrust-api-v1 (issue #58) is off in every run above, so the derives and path declarations behind it
      # are linted here, under the same four denied lints.
      - name: clippy (thrust-api-v1 with the OpenAPI feature)
        if: ${{ !cancelled() }}
        run: scripts/rs cargo clippy -p thrust-api-v1 --features openapi --all-targets --locked -- -D warnings

  # shellcheck over the shell the repository maintains (Lint phase, stage 1): every tracked `*.sh` and shell-shebang script, less `web/` and the
  # records of finished experiments, which .github/scripts/check-shell.sh names, and the `run:` blocks of the composite actions, which actionlint
  # does not read (yq and jq, both on the image, cut them out). The runner runs the scripts under dash, and no job read them before.
  # shellcheck is installed at an exact version through install-action (checked against its SHA-256 manifest), and not taken from the image,
  # which has 0.9.0: the image's version moves with the image, and the helper refuses any version but the one written here and in it
  # (test_workflow_wiring.py holds the two equal). The helper runs its control first (an unquoted variable must be refused, the repository's
  # configuration must be the one in effect), so a shellcheck that is not looking fails the job. No Rust toolchain and no cache: it is the
  # shortest job of the workflow, and runs only when a shell file, .shellcheckrc or the job itself changes (plan-ci.py).
  bash:
    if: contains(fromJSON(inputs.plan), 'bash')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck@0.11.0
      - name: shellcheck (the control, then every maintained script)
        run: sh .github/scripts/check-shell.sh

  # yamllint over the YAML the repository maintains (Lint phase, stage 2): that it parses, and that no mapping has a key twice, which no parser
  # refuses (the last wins; yq accepts it, measured) and which actionlint says only of a workflow and of an action a workflow uses, so it is
  # `dependabot.yml`, the compose files and the oracle's configuration that nothing read. .github/scripts/check-yaml.sh names the files
  # (every tracked `*.yml` and `*.yaml` less web/, the records of finished experiments and pnpm's lockfile) and, before it reads one, runs a
  # control: a key written twice and a file that does not parse must be refused, and a file that is only unstyled must pass, which shows that
  # .yamllint.yaml, and not yamllint's default (1,328 findings of style here), is the configuration in effect. yamllint is not on the image and
  # install-action has no manifest for it, so it comes as Schemathesis does in contract-pass-tools: a pinned setup-uv and a pinned version, held
  # equal to the helper's by test_workflow_wiring.py. No Rust toolchain and no cache.
  yaml:
    if: contains(fromJSON(inputs.plan), 'yaml')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.18"
          enable-cache: false
      - name: yamllint (installed at the version the helper is held to)
        run: uv tool install yamllint==1.38.0
      - name: yamllint (the control, then every maintained YAML file)
        run: sh .github/scripts/check-yaml.sh

  # The JSON the repository maintains (Lint phase, stage 3): that it parses, and that no object has a key twice, which no parser refuses (the last
  # wins; jq and yq take it, measured) and which no check read: 29 of the 180 files are named by no script, workflow or source file (git grep). The check is
  # .github/scripts/check-json.py, Python's own json module, which is on the image: biome 2.5.15 (which install-action offers) was measured on the
  # runner and by default reads 178 of the 180 files and exits 0 (a file over 1 MiB is skipped with a warning, a lockfile is never read) and misses
  # a key written twice with an escape, so it is not the check. The helper names the files (every tracked `*.json` less web/, the records of finished
  # experiments and any node_modules/), and before it reads one runs a control: a key twice (also in an array, also spelled with an escape), a file
  # that does not parse and NaN must be refused, an unstyled file, the same key in two objects and a number of 5,000 digits must pass. Nothing to
  # install or pin: no Rust toolchain, no cache.
  json:
    if: contains(fromJSON(inputs.plan), 'json')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JSON (the control, then every maintained file)
        run: python3 -I .github/scripts/check-json.py

  # ADR-0102: judges this workflow's jobs against the plan, through the action every called workflow uses (it runs assert-gate.sh and
  # sets the output only after that passed). `always()`, so it reports when a job was skipped, failed or cancelled. ci.yml's `gate`
  # requires the output: a `verdict` job that was itself skipped leaves this workflow `success` and proves nothing. The checkout is
  # here and not in the action, which is read from it.
  verdict:
    needs: [deps, lint, bash, yaml, json]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: judge
        uses: ./.github/actions/verdict
        with:
          needs: ${{ toJSON(needs) }}
          plan: ${{ inputs.plan }}
          jobs: deps lint bash yaml json
