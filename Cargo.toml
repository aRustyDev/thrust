[workspace]
resolver = "3"
members = [
    "crates/core/types",
    "crates/core/ports",
    "crates/core/usecases",
    "crates/core/html",
    "crates/adapters/memory",
    "crates/api/core",
    "crates/api/plane-types",
    "crates/api/v1",
    "crates/api/compat-plane",
    "crates/adapters/postgres",
    "crates/adapters/oidc",
    "crates/adapters/selfhosted",
    "crates/adapters/cloudflare",
    "crates/worker",
    "crates/preview-provisioner",
    "crates/edge",
    "crates/server",
    "crates/testing/suites/api",
    "crates/testing/suites/load",
    "crates/testing/profiling",
    "crates/testing/fixtures/oracle",
    "crates/editor/doc",
    "crates/spikes/editor-worker",
]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# --- runtime-agnostic (allowed in contracts / ports / core) ---
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# No generator features here: id generation is the IdGen port. Platform crates add `v7` plus an
# RNG source (`js` on wasm32) themselves, so core/contracts build everywhere unchanged.
uuid = { version = "1", default-features = false, features = ["serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# The OpenAPI document of `/api/v1` (issue #58, ADR-0032): derives and path declarations, behind `thrust-api-v1`'s `openapi`
# feature, so nothing of it is in the Worker bundle. 6.x writes OpenAPI 3.1 (the pin is 3.0.3: see `scripts/check-openapi.sh`).
utoipa = { version = "6", features = ["uuid"] }

# --- internal crates ---
thrust-contracts = { path = "crates/core/types" }
thrust-ports = { path = "crates/core/ports" }
thrust-core = { path = "crates/core/usecases" }
thrust-html = { path = "crates/core/html" }
thrust-adapters-memory = { path = "crates/adapters/memory" }
thrust-adapters-postgres = { path = "crates/adapters/postgres" }
thrust-adapters-cloudflare = { path = "crates/adapters/cloudflare" }
thrust-adapters-selfhosted = { path = "crates/adapters/selfhosted" }
thrust-adapters-oidc = { path = "crates/adapters/oidc" }
thrust-api = { path = "crates/api/core" }
thrust-plane-types = { path = "crates/api/plane-types" }
thrust-api-v1 = { path = "crates/api/v1" }
thrust-compat-plane = { path = "crates/api/compat-plane" }
# `default-features = false` must be here: Cargo ignores a member's own `default-features = false` on an inherited
# dependency unless the workspace entry has it. Every user of thrust-editor-doc asks for the one feature it needs.
thrust-editor-doc = { path = "crates/editor/doc", default-features = false }
thrust-oracle-fixture = { path = "crates/testing/fixtures/oracle" }
thrust-contract-tests = { path = "crates/testing/suites/api" }

# ADR-0006's panic policy: request-derived data can never panic, because on the Worker (panic=abort) a panic fails its own request
# and can fail others on the same isolate. A crate opts in with `[lints] workspace = true`: thrust-core, thrust-ports and every
# adapter. These four are in clippy's `restriction` group, off unless named here. `deny`, not `forbid`, so a site that is right (a
# startup `expect`, an index that a bound proves) can say so with `#[allow(clippy::..., reason = "...")]`. Test code is exempt
# through `clippy.toml`.
# cargo-fuzz builds with `--cfg fuzzing` (thrust-edge's fuzz harness exists only in tests and fuzz builds): an expected cfg.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
# Spike measurement profile for the wasm bundle. See research/0004 for the numbers.
opt-level = "s"
lto = true
codegen-units = 1
# NOT `strip = true`: it drops the wasm `target_features` section, wasm-bindgen then does not
# enable externref and dies with "externref table required for catch wrappers" (measured).
strip = "debuginfo"
# No `panic = ...` here on purpose: wasm32-unknown-unknown on stable is always
# panic=abort, while the native server must keep unwinding so CatchPanicLayer works.
# The panic policy is recorded in research/0004.

# argon2id at OWASP's minimum cost (19 MiB, t = 2) takes seconds unoptimised, and the tests pin that cost, so the hashing
# crates are optimised even in dev and test builds (issue #38). Only these two; everything else keeps the dev profile.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# The mock identity provider of the contract suite generates a 2048-bit RSA key once per test run; unoptimised that is
# many seconds.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3

# Build profile cargo-mutants uses for each mutant (no debuginfo: faster incremental builds).
# Selected by .cargo/mutants.toml. See .agents/skills/rust-test-mutation.
[profile.mutants]
inherits = "test"
debug = "none"
