[workspace]
resolver = "3"
members = [
    "crates/thrust-contracts",
    "crates/thrust-ports",
    "crates/thrust-core",
    "crates/thrust-adapters-memory",
    "crates/thrust-api",
    "crates/thrust-compat-plane",
    "crates/thrust-adapters-postgres",
    "crates/thrust-adapters-oidc",
    "crates/thrust-adapters-selfhosted",
    "crates/thrust-adapters-cloudflare",
    "crates/thrust-worker",
    "crates/thrust-server",
    "crates/thrust-contract-tests",
    "crates/thrust-editor-doc",
    "crates/thrust-editor-worker",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# --- runtime-agnostic (allowed in contracts / ports / core) ---
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# No generator features here: id generation is the IdGen port. Platform crates add `v7` plus an
# RNG source (`js` on wasm32) themselves, so core/contracts build everywhere unchanged.
uuid = { version = "1", default-features = false, features = ["serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# --- internal crates ---
thrust-contracts = { path = "crates/thrust-contracts" }
thrust-ports = { path = "crates/thrust-ports" }
thrust-core = { path = "crates/thrust-core" }
thrust-adapters-memory = { path = "crates/thrust-adapters-memory" }
thrust-adapters-postgres = { path = "crates/thrust-adapters-postgres" }
thrust-adapters-cloudflare = { path = "crates/thrust-adapters-cloudflare" }
thrust-adapters-selfhosted = { path = "crates/thrust-adapters-selfhosted" }
thrust-adapters-oidc = { path = "crates/thrust-adapters-oidc" }
thrust-api = { path = "crates/thrust-api" }
thrust-compat-plane = { path = "crates/thrust-compat-plane" }

[profile.release]
# Spike measurement profile for the wasm bundle. See research/0004 for the numbers.
opt-level = "s"
lto = true
codegen-units = 1
# NOT `strip = true`: it drops the wasm `target_features` section, wasm-bindgen then does not
# enable externref and dies with "externref table required for catch wrappers" (measured).
strip = "debuginfo"
# No `panic = ...` here on purpose: wasm32-unknown-unknown on stable is always
# panic=abort, while the native server must keep unwinding so CatchPanicLayer works.
# The panic policy is recorded in research/0004.

# argon2id at OWASP's minimum cost (19 MiB, t = 2) takes seconds unoptimised, and the tests pin that cost, so the hashing
# crates are optimised even in dev and test builds (issue #38). Only these two; everything else keeps the dev profile.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# The mock identity provider of the contract suite generates a 2048-bit RSA key once per test run; unoptimised that is
# many seconds.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3

# Build profile cargo-mutants uses for each mutant (no debuginfo: faster incremental builds).
# Selected by .cargo/mutants.toml. See .agents/skills/rust-test-mutation.
[profile.mutants]
inherits = "test"
debug = "none"
