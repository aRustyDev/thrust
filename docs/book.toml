[book]
title = "thrust"
src = "src"

[build]
# A SUMMARY.md link to a missing page is an error, not a silently created stub.
create-missing = false

[rust]
edition = "2021"

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output]

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
# The brand tokens come from .config/branding/ through the docs/branding symlink, because mdBook copies a path
# outside the book root to the wrong place. brand-mapping.css maps them onto mdBook's variables. Both files load
# after mdBook's own CSS, which is what lets the mapping override it.
additional-css = ["branding/colors.css", "brand-mapping.css"]
