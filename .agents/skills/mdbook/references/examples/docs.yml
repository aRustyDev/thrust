name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs raise what they need.
permissions: {}

env:
  MDBOOK_VERSION: "0.5.4"
  # Crate(s) the book chapters import; built into a dedicated target dir so feature/test builds
  # elsewhere cannot leave a second rlib behind (E0464).
  BOOK_CRATE: your-crate # placeholder: replace with the crate the chapters import
  CARGO_TERM_COLOR: never

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # mdBook itself is built from source on every run and never restored from a cache.
      # cache-bin "false" keeps it that way even if this step is moved after rust-cache.
      - name: Install mdBook (exact version, locked)
        run: cargo install mdbook --locked --version "=${MDBOOK_VERSION}"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/book"
          cache-bin: "false"

      - name: Build the crate the book links against
        env:
          CARGO_TARGET_DIR: target/book
        run: cargo build --locked -p "${BOOK_CRATE}"

      - name: Build the book and fail on ERROR lines
        run: |
          mdbook build docs > build.log 2>&1 || { cat build.log; exit 1; }
          cat build.log
          if grep -qE '^ERROR' build.log; then
            echo "::error::mdbook logged ERROR lines but exits 0 on them (bad include, bad [output.html] key)"
            exit 1
          fi

      - name: Fail on chapters not linked from SUMMARY.md
        run: |
          grep -oE '\]\([^)#]+\.md' docs/src/SUMMARY.md | sed -E 's/^\]\((\.\/)?//' | sort -u > listed.txt
          find docs/src -name '*.md' ! -name SUMMARY.md | sed 's|^docs/src/||' | sort -u > present.txt
          orphans="$(comm -13 listed.txt present.txt)"
          if [ -n "$orphans" ]; then
            echo "::error::chapters on disk but not in SUMMARY.md:"
            echo "$orphans"
            exit 1
          fi

      - name: Compile and run the book's Rust blocks
        run: mdbook test docs -L target/book/debug/deps

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # prove the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false # never cancel a deploy half-way
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
