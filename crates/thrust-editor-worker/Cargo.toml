[package]
name = "thrust-editor-worker"
description = "Spike 0006: Option A inside workerd. A bare Worker exposing the Rust editor-document conversions and the sanitiser for size and CPU measurement."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["sanitize"]
sanitize = ["thrust-editor-doc/sanitize"]

[dependencies]
thrust-editor-doc = { path = "../thrust-editor-doc", default-features = false }
serde_json = { workspace = true }
base64 = "0.22"
worker = { version = "0.8" }
console_error_panic_hook = "0.1"
