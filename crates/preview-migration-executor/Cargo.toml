[package]
name = "thrust-preview-migration-executor"
description = "Closed-by-default Worker for isolated preview database migrations"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
thrust-adapters-postgres = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.9"
thrust-adapters-cloudflare = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
proptest = "1"
