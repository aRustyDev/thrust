[package]
name = "thrust-adapters-memory"
description = "In-memory adapters for every port. Compiles for wasm32 and native; no runtime dependency."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Control-run mutants: deliberately broken behaviour that the contract suite MUST detect
# (scripts/mutants.sh). Never enabled outside that script.
mutant_ignore_tenant = []
mutant_dup_sequence = []
mutant_no_activity_dedupe = []
mutant_ignore_revoked = []
mutant_search_case_sensitive = []
mutant_set_password_every_user = []
# Issue #59 (retention): a row of exactly the window's age goes too; an outbox row goes though it was never dispatched; a work item
# goes though a work item under it is not old.
mutant_purge_at_cutoff = []
mutant_outbox_purge_by_age = []
mutant_purge_ignores_children = []

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
async-trait = { workspace = true }
# the profile's JSON settings
serde_json = { workspace = true }

[dev-dependencies]
# futures-executor rather than tokio, because the memory adapters never yield.
futures-executor = "0.3"
proptest = "1"
rstest = "0.26"
