[package]
name = "thrust-api"
description = "The shared axum router (ARCHITECTURE 2a thrust-api-core). Compiled into BOTH composition roots."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
thrust-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# default-features = false drops `tokio`, `http1`, `tracing`, `form`... — only the pure router
# + extractors remain, which is what compiles to wasm32 and runs under workerd.
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path"] }

# Test-only, the same pins as thrust-core's: `scripts/check-deps.sh` checks normal dependencies, so neither reaches the router's graph.
[dev-dependencies]
proptest = "1"
rstest = "0.26"

[features]
# Control-run mutants of the operator's door (scripts/mutants.sh, and the hermetic router test that shows the same: crates/thrust-compat-plane/tests/operator.rs).
# Never enabled outside those; the server crate forwards them.
mutant_operator_ignores_flag = []
mutant_operator_takes_admin_token = []
