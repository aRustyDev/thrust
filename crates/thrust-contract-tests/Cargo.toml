[package]
name = "thrust-contract-tests"
description = "ONE HTTP-level contract suite. Runs unchanged against every target via THRUST_BASE_URL."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
thrust-contracts = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net"] }
# rustls on both clients: Stage 2 points this same suite at a deployed `https://` / `wss://` Worker.
# Native-only test crate; none of this is in the Worker bundle.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { workspace = true, features = ["v4"] }
futures-util = { workspace = true, features = ["sink"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# The mock OIDC identity provider the suite serves on 127.0.0.1 (issue #38, `src/mock_idp.rs`): an axum server, and an
# RS256 signer written against the `rsa` crate directly, so that what verifies its ID tokens (the `openidconnect`
# crate inside the target) is not the code that made them.
axum = { version = "0.8", default-features = false, features = ["json", "form", "query", "tokio", "http1"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
# tests/model: generated operation sequences against a reference model (gap G-8).
proptest = "1"
