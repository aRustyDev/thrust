[package]
name = "thrust-preview-provisioner"
description = "Internal preview database provisioning Worker"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.9"
thrust-adapters-cloudflare = { workspace = true }
thrust-adapters-postgres = { workspace = true }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
futures-util = { workspace = true }

[dev-dependencies]
proptest = "1"
