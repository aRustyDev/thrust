[package]
name = "thrust-adapters-sqlite"
description = "SQLite Database adapter over a small synchronous `Sql` trait. rusqlite natively (the twin), workers-rs SqlStorage inside the instance-level Durable Object."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Only for the native twin (`NativeSql`). NEVER enabled for wasm32: it compiles SQLite from C.
native = ["dep:rusqlite"]
# Control-run mutants (scripts/mutants.sh): deliberately broken behaviour the contract suite MUST detect.
mutant_dup_sequence = []
# The gate never reopens after an abandoned transaction / does not exist (model test, 50-writer test).
mutant_gate_leak = []
mutant_no_gate = []
# `commit` applies its statements one by one instead of in one transaction (tests/commit.rs).
mutant_non_atomic_commit = []
# A migration that fails halfway is part of MIGRATIONS (the migration-failure demonstration on workerd, not a test).
mutant_broken_migration = []

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[dev-dependencies]
# tests/model: generated Database/Tx call sequences against a reference model (the Postgres adapter's twin of it).
thrust-adapters-sqlite = { path = ".", features = ["native"] }
proptest = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
futures-executor = "0.3"
rstest = "0.26"
# The reference implementation of search (a scan) the SQLite adapter is compared with.
thrust-adapters-memory = { workspace = true }
