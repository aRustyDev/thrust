# Stage 2 (real platform) config for spike 0001: `wrangler.toml` with real resource ids.
# Every resource is prefixed `thrust-spike-` and is torn down at the end of the stage.
# THE IDS BELOW BELONGED TO THE 2026-10-18 RUN AND WERE DELETED AT ITS END (research/0004 section 10.7).
# To run Stage 2 again, create the same resources first (the ledger lists them) and replace every id.
# NO secrets here: THRUST_ADMIN_TOKEN is a Worker secret (`wrangler secret put`), the database
# password lives only in the Hyperdrive config, and ids below are identifiers, not credentials.
name = "thrust-spike-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"
workers_dev = true

# Same hint as wrangler.toml: `fetch` runs closest to AWS us-east-1, where the database is (ADR-0094). The numbers in
# research/0004 section 10.3 were taken before this block existed, so a run with it is not comparable to them without
# saying so.
[placement]
region = "aws:us-east-1"

[build]
command = "../../scripts/rs worker-build --release . --no-default-features"

[triggers]
crons = ["* * * * *"]   # outbox sweeper (ADR-0046 / ADR-0072)

[vars]
THRUST_TEST_ROUTES = "1"            # spike only: exposes /internal/* and /_info to the contract suite
THRUST_ADAPTERS = "cloudflare"
THRUST_OUTBOX_FASTPATH = "on"
# The contract's CSRF tests need enforcement on (ADR-0052); `scripts/stage2-contract.sh` refuses a Worker that does not
# say so in /_info. The `csrfoff` pass needs a Worker deployed with "off" instead. The production default is off
# (wrangler.toml) until the custom frontend replaces the stock one.
THRUST_CSRF_ENFORCE = "on"
# The rate limits are the `[[ratelimits]]` bindings below, not vars: THRUST_SIGNIN_RATE_LIMIT and the count in THRUST_V1_RATE_LIMIT
# are not read on Cloudflare, and the Worker refuses a THRUST_V1_RATE_LIMIT period other than 10 or 60 seconds. (A window of 3600
# used to be set here so the contract's rate-limit test would not straddle a window boundary, research/0004 F3; the test now holds
# across a boundary, so no window is set.)

# Hyperdrive config thrust-spike-pg: role pr_1001 (schema pr_1001) on thrust-pg-dev, caching disabled.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "99c52fa606644158b8924075e62e5438"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "thrust-spike-blobs"

[[queues.producers]]
binding = "EVENTS"
queue = "thrust-spike-events"

[[queues.consumers]]
queue = "thrust-spike-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "thrust-spike-events-dlq"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDo"

# No Worker deployed from this file ever carried the rate limiter's class (it was deleted with the 2026-10-18 run), so `v1` is edited.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDo"]

# Rate Limiting bindings (ADR-0033, D-007). namespace_id is account-wide; 91001 to 91004 are unused by anything else here (91002 was
# `RL_CREATE`'s, for the slice's creates, until step 5c-3 of #58). The two that the app counts with are at the app's own defaults, which
# `scripts/stage2-contract.sh` expects of a main pass: sign-in (10) and an API key on /api/v1 (60). `RL` is the binding probe's.
[[ratelimits]]
name = "RL"
namespace_id = "91001"
simple = { limit = 3, period = 10 }

[[ratelimits]]
name = "RL_SIGNIN"
namespace_id = "91003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_V1"
namespace_id = "91004"
simple = { limit = 60, period = 60 }

# Secrets Store: the account's default store (empty before this spike); secret thrust-spike-probe.
[[secrets_store_secrets]]
binding = "SS"
store_id = "653d5f9de26046b7983d84041b15d3b7"
secret_name = "thrust-spike-probe"

[[send_email]]
name = "EMAIL"
