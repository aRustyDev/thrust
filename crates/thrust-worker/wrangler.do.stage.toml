# Cell `worker-do` DEPLOYED on the Woven account (spike 0002, issue #37, research/0011): `wrangler.do.toml` with real
# resource names. Every resource is `thrust-spike-do`-prefixed and is torn down at the end of the measurement by
# `scripts/spike-0002-do.sh down` (order: queue consumer, Worker, queues, bucket). There are no ids in this file: the
# resources are named, not numbered, and nothing here is a credential.
# THRUST_ADMIN_TOKEN is a Worker secret, put by `scripts/spike-0002-do.sh up` from a 0600 file.
name = "thrust-spike-do"
main = "entry.mjs"
compatibility_date = "2026-08-01"
workers_dev = true

[build]
command = "../../scripts/rs worker-build --release . --no-default-features"

[triggers]
crons = ["* * * * *"]   # outbox sweeper (ADR-0046 / ADR-0072), forwarded to the object; also the cell's low-rate load

[vars]
THRUST_TEST_ROUTES = "1"            # spike only: exposes /internal/*, /_info and the probes to the contract suite
THRUST_ADAPTERS = "durable"
THRUST_OUTBOX_FASTPATH = "on"
THRUST_CREATE_RATE_LIMIT = "30"     # the main pass wants 30; the engine pass redeploys with `--var THRUST_CREATE_RATE_LIMIT:1000000`
# The contract's CSRF tests need enforcement on (ADR-0052); `scripts/stage2-contract.sh` refuses a Worker that does not say
# so in /_info (the `csrfoff` pass needs "off"). A deployed main pass also wants a cheap argon2id cost, or every fixture seeds
# six passwords at the real cost: deploy with `--var THRUST_ARGON2_M_KIB:64 --var THRUST_ARGON2_T:1 --var THRUST_ARGON2_P:1`.
THRUST_CSRF_ENFORCE = "on"
# Fixed windows are aligned to the wall clock; one hour keeps a slow test from straddling a boundary (research/0004 F3).
THRUST_RATE_WINDOW_SECS = "3600"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "thrust-spike-do-blobs"

[[queues.producers]]
binding = "EVENTS"
queue = "thrust-spike-do-events"

[[queues.consumers]]
queue = "thrust-spike-do-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "thrust-spike-do-events-dlq"

[[durable_objects.bindings]]
name = "APP"
class_name = "AppDo"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDo"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDo", "RoomDo"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AppDo"]
