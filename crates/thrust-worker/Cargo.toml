[package]
name = "thrust-worker"
description = "Composition root: wasm32 Cloudflare Worker (cargo feature set `cloudflare`)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
thrust-core = { workspace = true }
thrust-api = { workspace = true }
thrust-adapters-memory = { workspace = true }
thrust-adapters-cloudflare = { workspace = true }
serde_json = { workspace = true }
worker = { version = "0.8", features = ["http", "queue"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path"] }
tower-service = "0.3"
console_error_panic_hook = "0.1"
