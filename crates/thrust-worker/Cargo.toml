[package]
name = "thrust-worker"
description = "Composition root: wasm32 Cloudflare Worker (cargo feature set `cloudflare`)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# `memory` is the dev/test adapter set. Build the production-shaped bundle with
# `--no-default-features` so the size numbers measure only the Cloudflare adapter set.
default = ["memory"]
memory = ["dep:thrust-adapters-memory"]

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
thrust-core = { workspace = true }
thrust-api = { workspace = true }
thrust-adapters-cloudflare = { workspace = true }
thrust-adapters-postgres = { workspace = true }
# The SQLite adapter WITHOUT its `native` feature: rusqlite never reaches the Worker (scripts/check-deps.sh checks it).
thrust-adapters-sqlite = { workspace = true }
thrust-adapters-memory = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
worker = { version = "0.8", features = ["http", "queue"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path"] }
tower-service = "0.3"
http-body-util = "0.1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# only to name `Type`/`ToSql` in the Stage 2 `pgshapes` probe; same declaration as the adapters'
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
