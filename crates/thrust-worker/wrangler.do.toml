# Cell `worker-do` (spike 0002, issue #37, ADR-0040 Option 5): the SQLite adapter inside ONE instance-level Durable
# Object, `AppDo`. The Worker only forwards to it; the router and the use-cases run in the object over its SQLite.
# No Hyperdrive, no VPC service, no tunnel, no Postgres. Local-dev ids only; a deployed run (research/0011) uses
# `thrust-spike-*` resources and is torn down afterwards.
#
# NO secrets in this file: THRUST_ADMIN_TOKEN is a Worker secret (or arrives through the environment in
# scripts/worker-dev.sh).
name = "thrust-worker-do"
main = "entry.mjs"
# Same date and reason as wrangler.toml.
compatibility_date = "2026-08-01"
workers_dev = false

[build]
command = "../../scripts/rs worker-build --release . --no-default-features"

[triggers]
crons = ["* * * * *"]   # outbox sweeper (ADR-0046 / ADR-0072), forwarded to the object

[vars]
THRUST_ADAPTERS = "durable"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "thrust-spike-blobs"

[[queues.producers]]
binding = "EVENTS"
queue = "thrust-spike-events"

[[queues.consumers]]
queue = "thrust-spike-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3

[[durable_objects.bindings]]
name = "APP"
class_name = "AppDo"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDo"

# v1 is what wrangler.toml declares, so a deployed Worker moves from one config to the other; v2 adds the object.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDo", "RoomDo"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AppDo"]
