[package]
name = "thrust-edge"
description = "The Worker on the shared hostname (ADR-0111): production through a service binding, an opted-in target through its Worker Preview, decided by Flagship."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# cdylib is what worker-build ships; rlib lets the tests in tests/ link the decision modules natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
# HMAC-SHA256 for the pin cookie, and SHA-256 for the RS256 check of the Access token. The digest-0.10 line, the one `rsa` 0.9 uses
# (both versions are already in the lock through openidconnect), so the edge adds no new crate version.
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
# Verifies Access's RS256 signature with its PUBLIC keys only. RUSTSEC-2023-0071 concerns private-key operations: see deny.toml.
# No `std`: it turns on rand_core's getrandom, which has no wasm32 backend here, and verifying needs no randomness.
rsa = { version = "0.9", default-features = false, features = ["sha2"] }

# The runtime glue (src/runtime.rs) exists only in the wasm32 build; the decision modules and their tests build natively without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
proptest = "1"
rstest = "0.26"
# Test keys only: a seeded RNG makes the RSA key pairs the Access tests sign with deterministic (AGENTS.md rule 6).
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
