[package]
name = "thrust-api-v1"
description = "Plane's public v1 API (/api/v1) as a route group over thrust-core use-cases (ADR-0031, ADR-0034). Plane-shaped types stay in this crate (#52)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# ADR-0006's panic policy applies: a request cannot make this crate panic (a reproduced Plane 500 is a handled response).
[lints]
workspace = true

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
thrust-core = { workspace = true }
thrust-api = { workspace = true }
# What the pin does to a work item's description before it keeps it (`validate_html_content`); the compat plane has the same one.
thrust-editor-doc = { path = "../thrust-editor-doc", default-features = false, features = ["sanitize"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The query string, as `axum`'s own `Query` reads it (already in the graph through axum): a name given twice keeps its last value.
form_urlencoded = "1"
# NFKD, which Django's `slugify` folds a name with before it keeps the ASCII of it (D-031 (2)). Already in the Worker's graph, through
# tokio-postgres's SCRAM (stringprep); the measured size of this direct dependency is in the PR that added it.
unicode-normalization = "0.1"
# Runtime-free, as in thrust-api: this crate compiles to wasm32 and runs under workerd.
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path"] }

# Test-only (scripts/check-deps.sh checks normal dependencies). The memory adapters are the reference implementation of every
# port; the router is driven in process with `oneshot`, so no socket and no runtime beyond what the executor needs.
[dev-dependencies]
thrust-adapters-memory = { workspace = true }
# The oracle's seed as a fixture (#58): loaded into the memory adapter and read through these routes in tests/oracle_seed.rs.
thrust-oracle-fixture = { path = "../thrust-oracle-fixture" }
tower = { version = "0.5", features = ["util"] }
# The router future never yields to a reactor, so a plain executor drives it (as in thrust-core's tests).
futures-executor = "0.3"
proptest = "1"
rstest = "0.26"
