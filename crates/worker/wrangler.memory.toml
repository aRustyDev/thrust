# In-isolate adapter set (dev/test only): no bindings to anything that holds data. Proves the dual build.
name = "thrust-worker-memory"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"
workers_dev = false

# The one binding it has: the running version, which the Worker sends as `x-thrust-version` (issue #49), as the production-shaped config
# does. It lets scripts/smoke-deploy.sh run against this Worker with no Docker, which is how the smoke is tried before it is deployed.
[version_metadata]
binding = "CF_VERSION_METADATA"

# The mail service of the password reset (E3): under `wrangler dev` without `remote = true` the binding is a simulator that sends nothing and
# writes each message it is asked to send to the log and to files, which is what the `mail` pass of the contract suite reads
# (scripts/contract.sh worker-memory mail). It is used only when `THRUST_EMAIL_FROM` names a sender; without one the Worker has no mail service.
# Restricted to the sender that pass uses, as the deployed template restricts its binding to the environment's: the simulator enforces it, so
# the pass also shows that the restriction lets the adapter's own sender through (a named one) and refuses any other.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["no-reply@thrust.test"]

[build]
command = "../../scripts/rs worker-build --release"

[vars]
# Whether a mutation authenticated by the session cookie must carry the CSRF token (ADR-0052, Q-0050.8). OFF while the
# stock Plane frontend is what talks to this Worker: it sends the token only on its auth form posts, so enforcing it on
# JSON mutations would break it. Until then the cookie-side protection is SameSite=Lax, HttpOnly, Secure and the __Host-
# prefix, as in Plane. Set "on" when the custom frontend replaces the stock one (PLAN.md, M4). The contract targets and
# Stage 2 run with it on (scripts/worker-dev.sh, wrangler.stage2.toml).
THRUST_CSRF_ENFORCE = "off"
