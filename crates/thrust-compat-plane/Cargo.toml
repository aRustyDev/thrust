[package]
name = "thrust-compat-plane"
description = "Plane's internal API (/api/ and /auth/) as a route group over thrust-core use-cases (ADR-0034). Plane-shaped types stay in this crate (#52)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# ADR-0006's panic policy applies, as it does to `thrust-api-v1` (#51): request-derived data cannot make this crate panic, so a
# reproduced Plane 500 is a handled response and never a crash. On the Worker (panic = abort) a panic fails its own request.
[lints]
workspace = true

[features]
# Control-run mutant (scripts/mutants.sh), never enabled outside it; `thrust-server` forwards it: an API key may change the password.
mutant_change_password_allows_api_key = []
# The OIDC routes (D-040): `/api/instances/` says the provider is on although none is configured (the switch of a dark deployment), and
# a refused login's redirect carries no `error_code` (the one thing the app reads from it).
mutant_oidc_flag_always_on = []
mutant_oidc_failure_redirect_no_code = []
# The password reset by email (D-041): `/api/instances/` says mail is on although nothing can send it, and a refused reset's redirect carries
# no `error_code`.
mutant_smtp_flag_always_on = []
mutant_reset_redirect_without_code = []

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
thrust-core = { workspace = true }
thrust-api = { workspace = true }
# The three 500 bodies of the pin and the one function that answers them, shared with /api/v1 (#51).
thrust-plane-types = { workspace = true }
# Cleans the HTML of a work item's description as the pin does: the `sanitize` feature only. Not `yjs`, whose `yrs` reaches
# getrandom and so wasm-bindgen and js-sys on wasm32, which scripts/check-deps.sh keeps out of this crate.
thrust-editor-doc = { path = "../thrust-editor-doc", default-features = false, features = ["sanitize"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The reset form is an urlencoded post, and the pin takes a forgot-password body in either form: axum's own form support, named.
serde_urlencoded = "0.7"
# Runtime-free, as in thrust-api: this crate compiles to wasm32 and runs under workerd.
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path"] }

# Test-only (scripts/check-deps.sh checks normal dependencies). The memory adapters are the reference implementation
# of every port; the router is driven in process with `oneshot`, so no socket and no runtime beyond tokio's test macro.
[dev-dependencies]
thrust-adapters-memory = { workspace = true }
tower = { version = "0.5", features = ["util"] }
# The router future never yields to a reactor, so a plain executor drives it (as in thrust-core's tests).
futures-executor = "0.3"
proptest = "1"
rstest = "0.26"
# The scripted OIDC provider of tests/oidc.rs implements an `async_trait` port.
async-trait = { workspace = true }
# tests/reset.rs builds a link whose `uidb64` is not UTF-8.
base64 = "0.22"
