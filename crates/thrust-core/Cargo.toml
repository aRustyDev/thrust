[package]
name = "thrust-core"
description = "Use-cases. Depends on ports + contracts only."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Session tokens are stored hashed. Pure Rust, no platform crate; it is already in the Worker graph
# through tokio-postgres' SCRAM, so the version matches and wasm32 is known to build it.
sha2 = { version = "0.11", default-features = false }
# argon2id for passwords (ADR-0050). Pure Rust and no platform crate, so core builds it for wasm32 and native alike (measured
# in the issue #38 feasibility probe). No `getrandom` feature: the salt comes from the `Rng` port, not from the platform.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
subtle = { version = "2", default-features = false }

# Test-only. `scripts/check-deps.sh` checks normal dependencies, so none of these reach the core graph.
# The memory adapters are the reference implementation the use-case tests run against; the executor is
# futures-executor rather than tokio, because the memory adapters never yield.
[dev-dependencies]
thrust-adapters-memory = { workspace = true }
futures-executor = "0.3"
proptest = "1"
rstest = "0.26"
