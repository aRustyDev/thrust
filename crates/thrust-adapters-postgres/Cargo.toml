[package]
name = "thrust-adapters-postgres"
description = "Postgres Database adapter at the tokio-postgres::Client level. One SQL implementation, two connection strategies (native pool / Hyperdrive socket)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Only for the `migrate` binary and the testcontainers tests. NEVER enabled for wasm32. It carries the TLS client (`tls`): rustls and
# tokio-rustls, which the workspace already builds for `reqwest`, with the `ring` provider and not `aws-lc-rs`.
native = ["tokio-postgres/runtime", "dep:tokio", "dep:rustls", "dep:tokio-rustls"]
# Control-run mutant (scripts/mutants.sh): the round-trip counter counts nothing. The budget test must notice (issue #39).
mutant_count_nothing = []
# Control-run mutant (scripts/mutants.sh): a work item page sends one more statement for every row it returns (issue #39).
mutant_extra_stmt_per_row = []

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"
required-features = ["native"]

# The TLS client's own tests: real handshakes in memory, no Docker, so they are in the hermetic loop wherever `native` is on (the
# workspace build turns it on through thrust-adapters-selfhosted).
[[test]]
name = "tls"
path = "tests/tls.rs"
required-features = ["native"]

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
# `js` makes it build for wasm32; `runtime` (TCP connect) is added only by the native feature.
tokio-postgres = { version = "0.7", default-features = false, features = ["js", "with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"], optional = true }
# Only with `native`. `ring` and not the default `aws_lc_rs`: the workspace has no aws-lc-rs and the C build it brings.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

[dev-dependencies]
# tests/tls.rs: certificates made per run, so a wrong CA and an expired leaf are one call each and no private key is committed.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
proptest = "1"
rstest = "0.26"
# `io-util` for the in-memory pipe the handshakes run over, `net` for the one-connection server that watches for a downgrade.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-util", "net"] }
