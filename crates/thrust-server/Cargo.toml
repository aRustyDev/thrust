[package]
name = "thrust-server"
description = "Composition root: native axum/tokio server (cargo feature set `selfhosted`)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "thrust-server"
path = "src/main.rs"

[features]
# Pass-through to the memory adapter's control-run mutants (scripts/mutants.sh).
mutant_ignore_tenant = ["thrust-adapters-memory/mutant_ignore_tenant"]
mutant_dup_sequence = ["thrust-adapters-memory/mutant_dup_sequence"]
mutant_no_activity_dedupe = ["thrust-adapters-memory/mutant_no_activity_dedupe"]
mutant_ignore_revoked = ["thrust-adapters-memory/mutant_ignore_revoked"]
mutant_search_case_sensitive = ["thrust-adapters-memory/mutant_search_case_sensitive"]
# Pass-through to thrust-core's control-run mutants.
mutant_skip_csrf = ["thrust-core/mutant_skip_csrf"]
mutant_csrf_never = ["thrust-core/mutant_csrf_never"]
mutant_csrf_always = ["thrust-core/mutant_csrf_always"]
mutant_unverified_email = ["thrust-core/mutant_unverified_email"]
# The operator's password reset (Q-F7): no strength check, sessions left alive, the hash written to every user, the test routes' token
# accepted at its door, its switch ignored.
mutant_operator_skips_strength = ["thrust-core/mutant_operator_skips_strength"]
mutant_operator_keeps_sessions = ["thrust-core/mutant_operator_keeps_sessions"]
# A person's change of their own password (D-039): the old password unchecked, no strength check, sessions left alive, an API key let in.
mutant_change_password_skips_old = ["thrust-core/mutant_change_password_skips_old"]
mutant_change_password_skips_strength = ["thrust-core/mutant_change_password_skips_strength"]
mutant_change_password_keeps_sessions = ["thrust-core/mutant_change_password_keeps_sessions"]
mutant_change_password_allows_api_key = ["thrust-compat-plane/mutant_change_password_allows_api_key"]
# OIDC through the compat routes (D-040): the login's state reusable, the dark switch ignoring the provider, a refusal with no error code.
mutant_oidc_state_reusable = ["thrust-core/mutant_oidc_state_reusable"]
# The password reset by email (D-041).
mutant_reset_token_reusable = ["thrust-core/mutant_reset_token_reusable"]
mutant_reset_ignores_expiry = ["thrust-core/mutant_reset_ignores_expiry"]
mutant_reset_uid_unchecked = ["thrust-core/mutant_reset_uid_unchecked"]
mutant_reset_takes_token_first = ["thrust-core/mutant_reset_takes_token_first"]
mutant_reset_skips_strength = ["thrust-core/mutant_reset_skips_strength"]
mutant_reset_keeps_sessions = ["thrust-core/mutant_reset_keeps_sessions"]
mutant_reset_ignores_cooldown = ["thrust-core/mutant_reset_ignores_cooldown"]
mutant_oidc_flag_always_on = ["thrust-compat-plane/mutant_oidc_flag_always_on"]
mutant_oidc_failure_redirect_no_code = ["thrust-compat-plane/mutant_oidc_failure_redirect_no_code"]
mutant_set_password_every_user = ["thrust-adapters-memory/mutant_set_password_every_user"]
mutant_operator_takes_admin_token = ["thrust-api/mutant_operator_takes_admin_token"]
mutant_operator_ignores_flag = ["thrust-api/mutant_operator_ignores_flag"]
# Pass-through to thrust-adapters-postgres's control-run mutants (issue #39). They only mean something on `native-pg`.
mutant_count_nothing = ["thrust-adapters-postgres/mutant_count_nothing"]
mutant_extra_stmt_per_row = ["thrust-adapters-postgres/mutant_extra_stmt_per_row"]

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
thrust-core = { workspace = true }
thrust-api = { workspace = true }
thrust-compat-plane = { workspace = true }
thrust-api-v1 = { workspace = true }
thrust-adapters-memory = { workspace = true }
thrust-adapters-selfhosted = { workspace = true }
thrust-adapters-postgres = { workspace = true }
thrust-adapters-oidc = { workspace = true }
serde_json = { workspace = true }
# The native server is the only place axum's tokio/http1 features are switched on.
axum = { version = "0.8", default-features = false, features = ["json", "query", "matched-path", "tokio", "http1"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
