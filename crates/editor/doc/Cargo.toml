[package]
name = "thrust-editor-doc"
description = "The Plane editor document in Rust (ProseMirror JSON, HTML, Yjs XmlFragment) for the node/mark set in @plane/editor, and, behind the `sanitize` feature, a re-export of the sanitiser in thrust-html (the one thrust-api-v1 and thrust-compat-plane use). Began as spike 0006."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["yjs", "sanitize"]
# The Yjs update encoding (`ydoc`). yrs reaches getrandom through fastrand, which brings wasm-bindgen and js-sys on wasm32, so a
# crate that wants only the sanitiser (thrust-compat-plane) turns this off; scripts/check-deps.sh keeps those out of it.
yjs = ["dep:yrs"]
# thrust-html (ammonia, which pulls html5ever) re-exported as `sanitize`; split out so the size of the conversions alone can be measured
sanitize = ["dep:thrust-html"]

[dependencies]
yrs = { version = "0.28", optional = true }
serde_json = "1"
base64 = "0.22"
# The sanitiser moved to crates/core/html (issue #48) so that the use-cases can call it; `thrust_editor_doc::sanitize` is the same crate.
thrust-html = { workspace = true, optional = true }
regex = "1"
htmlentity = "1"

[dev-dependencies]
# the schema dump is compared in the order the real schema lists nodes/marks/attrs
serde_json = { version = "1", features = ["preserve_order"] }
# tests/roundtrip.rs: generated documents through the JSON, Yjs and HTML round trips (gap G-10)
proptest = "1"
