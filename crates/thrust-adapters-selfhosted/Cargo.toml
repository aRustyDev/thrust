[package]
name = "thrust-adapters-selfhosted"
description = "Native (tokio) adapters for the self-hosted set. Never compiled into the Worker."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Control-run mutant (scripts/mutants.sh): recycle a connection that is still inside a transaction.
mutant_discard_noop = []
# Control-run mutant (scripts/mutants.sh): the round-trip counter in thrust-adapters-postgres counts nothing (issue #39).
mutant_count_nothing = ["thrust-adapters-postgres/mutant_count_nothing"]

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
thrust-adapters-postgres = { workspace = true, features = ["native"] }
async-trait = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { workspace = true, features = ["v7"] }
# the operating system's generator, for the `Rng` port
getrandom = "0.4"
# outbound HTTP for the `Fetch` port (an OIDC provider's discovery, token and key endpoints)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }

[dev-dependencies]
# The oracle's seed as a fixture (#58): loaded into a real Postgres, emptied by `reset`, and loaded again (tests/pg_adapter.rs).
thrust-oracle-fixture = { path = "../thrust-oracle-fixture" }
# tests/model: generated Database/Tx call sequences against a reference model (gap G-9).
proptest = "1"
serde_json = { workspace = true }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
