[package]
name = "thrust-contracts"
description = "Wire/event/domain data types shared by every crate. No runtime, no platform code."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# This crate does not inherit the workspace lints (it is held to rustc's defaults), but `fuzzing` is the cfg cargo-fuzz builds with and the
# `fuzz_harness` module (rust-test-fuzz) is compiled under it, so it has to be an expected name here as it is for the crates that inherit.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# No `clock` feature on purpose: `Utc::now()` does not exist in this build of chrono, so
# domain code is forced to take time from the `Clock` port.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

[dev-dependencies]
proptest = "1"
