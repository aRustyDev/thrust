[package]
name = "thrust-ports"
description = "Port traits (driven side). Futures are Send; see research/0004 for why."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thrust-contracts = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# A profile keeps its free-form settings as a JSON object (`UserProfile::preferences`).
serde_json = { workspace = true }
# `alloc` only: BoxFuture. No executor, no tokio.
futures-util = { workspace = true }

[dev-dependencies]
# the ports crate has no executor of its own; the memory adapters never yield, so this is enough to drive a test
futures-executor = "0.3"
proptest = "1"
rstest = "0.26"
