[package]
name = "thrust-oracle-fixture"
description = "The v1 oracle's seed (tools/oracle-v1/scripts/seed.py) as a fixture for /internal/seed (issue #58)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oracle-fixture"
path = "src/bin/oracle_fixture.rs"

[dependencies]
thrust-contracts = { workspace = true }
serde_json = { workspace = true }
# The oracle's ids are uuid5 over a fixed namespace, so that a rebuilt stack seeds byte-identical ids: this crate is where
# Thrust computes them, and the only one that needs the `v5` feature.
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
proptest = "1"
