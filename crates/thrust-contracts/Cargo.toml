[package]
name = "thrust-contracts"
description = "Wire/event/domain data types shared by every crate. No runtime, no platform code."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# No `clock` feature on purpose: `Utc::now()` does not exist in this build of chrono, so
# domain code is forced to take time from the `Clock` port.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
