[package]
name = "thrust-adapters-cloudflare"
description = "workers-rs adapters (R2, Queues, Hyperdrive, DO, ...). wasm32 only; never compiled into the native server."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Planted bugs of the email adapter (E3), for scripts/mutants.sh: each makes one rule of `email.rs` wrong, and `tests/email.rs` must fail.
# Never enabled outside a control run.
mutant_cf_email_swap_refusal_and_outage = []
mutant_cf_email_unknown_code_is_refused = []
mutant_cf_email_from_is_recipient = []
mutant_cf_email_recipient_unchecked = []

[dependencies]
thrust-contracts = { workspace = true }
thrust-ports = { workspace = true }
thrust-adapters-postgres = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
worker = { version = "0.8", features = ["http", "queue"] }
uuid = { workspace = true, features = ["v7", "js"] }
# `crypto.getRandomValues`, for the `Rng` port (the same source uuid's `js` feature draws on)
getrandom = { version = "0.4", features = ["wasm_js"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
proptest = "1"
rstest = "0.26"
# An independent reading of an address (E3's tests: what `is_plain_address` accepts, a parser that is not ours reads as one address), as the
# SMTP adapter's wire tests read a message with it. A test dependency only.
mailparse = "0.18"
