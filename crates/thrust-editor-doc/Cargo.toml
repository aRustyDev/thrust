[package]
name = "thrust-editor-doc"
description = "Spike 0006: Rust model of the Plane editor document (ProseMirror JSON, HTML, Yjs XmlFragment) for the node/mark set in @plane/editor"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["yjs", "sanitize"]
# The Yjs update encoding (`ydoc`). yrs reaches getrandom through fastrand, which brings wasm-bindgen and js-sys on wasm32, so a
# crate that wants only the sanitiser (thrust-compat-plane) turns this off; scripts/check-deps.sh keeps those out of it.
yjs = ["dep:yrs"]
# ammonia pulls html5ever; split out so the size of the conversions alone can be measured
sanitize = ["dep:ammonia"]

[dependencies]
yrs = { version = "0.28", optional = true }
serde_json = "1"
base64 = "0.22"
ammonia = { version = "4", optional = true }
regex = "1"
htmlentity = "1"

[dev-dependencies]
# the schema dump is compared in the order the real schema lists nodes/marks/attrs
serde_json = { version = "1", features = ["preserve_order"] }
# tests/roundtrip.rs: generated documents through the JSON, Yjs and HTML round trips (gap G-10)
proptest = "1"
